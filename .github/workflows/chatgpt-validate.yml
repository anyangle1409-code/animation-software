name: ChatGPT validate curl wording alignment
on:
  push:
    branches: [chatgpt/absolute-retarget-imports]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged curl wording alignment
        run: python .github/chatgpt_curl_wording.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated wording alignment and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/exercises/definitions/bicepCurl.ts docs/BICEP_CURL_REVIEW_HANDOFF.md AI_CHANGELOG.md
          git rm .github/chatgpt_curl_wording.py .github/workflows/chatgpt-validate.yml
          git commit -m "docs: align curl elbow-drift coaching"
          git push
