name: V14 recovery investigation (read-only)
on:
  push:
    branches: ['claude/v14-recovery-investigation-*']
    paths: ['scripts/v14_investigation/**', '.github/workflows/v14-recovery-investigation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v14-investigation-${{ github.ref }}
  cancel-in-progress: false
env:
  R57_COMMIT: 025d5f28fa7eba2064fba565b1c9b60119cdd2cb
jobs:
  refine-determinism:
    # refine() on the R41 source in four fresh processes: twice exactly as the builder runs it (Python-set order into
    # bmesh.ops), twice with index-sorted element lists.  Read-only: R41 is checked out at its commit, nothing is saved.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [unsorted, sorted, patched]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R57_COMMIT }}
          path: r57src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cloud Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python -m pip install bpy==5.2.0 numpy scipy
      - name: refine() determinism run
        run: |
          FLAG=""; [ "${{ matrix.mode }}" = "sorted" ] && FLAG="--sorted"
          if [ "${{ matrix.mode }}" = "patched" ]; then
            # the candidate fix, applied to a scratch copy only (scripts/body_v2 is not modified)
            mkdir -p "$RUNNER_TEMP/patched" && cp scripts/body_v2/refine_torso_blender.py "$RUNNER_TEMP/patched/"
            patch "$RUNNER_TEMP/patched/refine_torso_blender.py" scripts/v14_investigation/CANDIDATE_deterministic_refine.patch
            export V14INV_REFINE_DIR="$RUNNER_TEMP/patched"
          fi
          python scripts/v14_investigation/refine_determinism_blender.py -- "$GITHUB_WORKSPACE/r57src" \
            "out/gh_refine_${{ matrix.mode }}_${{ matrix.rep }}.json" $FLAG
      - uses: actions/upload-artifact@v4
        with:
          name: v14inv-refine-${{ matrix.mode }}-${{ matrix.rep }}-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: error
  cut-accounting-reconstructed-w8:
    # the V14 leg cut replayed on the preserved reconstructed W8 (run 39922636070, artifact 12487119841) - read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cloud Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python -m pip install bpy==5.2.0 numpy scipy
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12487119841'
          run-id: 39922636070
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/w8
      - name: Cut accounting
        run: |
          B="$(find "${{ runner.temp }}/w8" -name '*.blend' | head -1)"; echo "input: $B"; sha256sum "$B"
          python scripts/v14_investigation/cut_accounting_blender.py -- "$B" out/gh_cut_reconstructed_W8.json
          sha256sum "$B"
      - uses: actions/upload-artifact@v4
        with:
          name: v14inv-cut-recon-w8-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: error
  replay-l0-archived-v14:
    # rebuild W8 with L0's preserved triangulation (replay_build_blender.py), then the V14 leg step at the archived
    # v14b script version (bd439886), then compare with the preserved L0 arrays and the archived V14 report
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.R57_COMMIT }}
          path: r57src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cloud Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python -m pip install bpy==5.2.0 numpy scipy scikit-image==0.25.2 lazy_loader packaging
      - name: Replay W8 (L0 triangulation)
        env:
          V2_SAVE_BLEND: '1'
        run: |
          python scripts/v14_investigation/replay_build_blender.py -- "$GITHUB_WORKSPACE/r57src" "$RUNNER_TEMP/W8r" 2.0 \
            scripts/v14_investigation/evidence/build_L0/refined_mesh_and_offsets.npz 2>&1 | grep -E "V2_REPLAY|V2_SAVED|Error|Traceback" || true
          test -f "$RUNNER_TEMP/W8r/body_v2.blend"
      - name: V14 leg step at the archived script version (bd439886), scratch copy
        env:
          V2_LEGS_RENDER: '0'
        run: |
          D="$RUNNER_TEMP/legs_bd439886"; mkdir -p "$D/fit"
          git show bd439886:scripts/body_v2/legs_v2_blender.py > "$D/legs_v2_blender.py"
          for f in ref_leg_side_profile.json ref_front_profile.json; do git show bd439886:scripts/body_v2/fit/$f > "$D/fit/$f"; done
          python "$D/legs_v2_blender.py" -- "$RUNNER_TEMP/W8r/body_v2.blend" "$GITHUB_WORKSPACE/r57src" "$RUNNER_TEMP/V14r" 2>&1 | grep -E "LEGS_V2 |Traceback" | cut -c1-300 || true
          python scripts/v14_investigation/cut_accounting_blender.py -- "$RUNNER_TEMP/W8r/body_v2.blend" "$RUNNER_TEMP/cut_W8r.json" | cut -c1-200
      - name: Compare with L0 and the archived V14
        run: |
          set +e
          python scripts/v14_investigation/compare_replay.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/W8r" "$RUNNER_TEMP/V14r" "$RUNNER_TEMP/cut_W8r.json" out/replay_compare.json
          rc=$?
          python - <<'PY'
          import json
          d = json.load(open("out/replay_compare.json"))
          for k in ("PASS_exact_archived_V14_reproduced", "V14_vertices", "W8_rest_identical", "W8_tris_identical", "W8_offsets_max_dev_mm",
                    "W8_proportion_max_dev_mm", "cut_fingerprints_identical_to_L0", "V14_report_leaves_vs_archive"):
              print(f"::notice title=replay {k}::{d[k]}")
          print(f"::notice title=replay V14 report differences::{json.dumps(d['V14_report_leaves_differing_from_archive'])[:900]}")
          print(f"::notice title=replay W8 report differences::{json.dumps(d['W8_report_leaves_differing'])[:900]}")
          PY
          cp "$RUNNER_TEMP/V14r/legs_v2_report.json" out/ ; cp "$RUNNER_TEMP/cut_W8r.json" out/
          ( cd "$RUNNER_TEMP" && sha256sum W8r/body_v2.blend V14r/body_v2_legs.blend ) > out/replay_blend_sha256.txt
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14inv-replay-l0-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: error
  summarize:
    needs: [refine-determinism, cut-accounting-reconstructed-w8]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: v14inv-*-${{ github.run_id }}
          path: ${{ runner.temp }}/res
          merge-multiple: true
      - name: Summarise (GitHub runs, and GitHub plus the committed local evidence)
        run: |
          python scripts/v14_investigation/summarize.py "${{ runner.temp }}/res" summary/github_only
          cp scripts/v14_investigation/evidence/*.json "${{ runner.temp }}/res/"
          python scripts/v14_investigation/summarize.py "${{ runner.temp }}/res" summary/with_local
          cat summary/github_only/v14_investigation_summary.md summary/with_local/v14_investigation_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the results as annotations (readable through the API without downloading artifacts)
        run: |
          python - <<'PY'
          import json
          d = json.load(open("summary/with_local/v14_investigation_summary.json"))
          for k, v in d["verdicts"].items():
              print(f"::notice title=verdict {k}::{v}")
          for k, v in d["refine_runs"].items():
              print(f"::notice title=refine {k}::{v['mode']} beautify={v['beautify_geom']} tri={v['sha256_triangles_geometric'][:16]} verts={v['sha256_vertex_positions_as_set'][:16]}")
          PY
      - name: Publish the cut accounting as annotations (own step - GitHub keeps at most 10 notices per step)
        run: |
          python - <<'PY'
          import json
          d = json.load(open("summary/with_local/v14_investigation_summary.json"))
          for k, v in d["cut_runs"].items():
              print(f"::notice title=cut {k}::" + ", ".join(f"{a}={b}" for a, b in v.items() if not a.endswith("sha256")
                    and "sha256_band" not in a) + f", band_tri_r={v['r_sha256_band_triangles'][:12]}, band_vert_r={v['r_sha256_band_vertex_positions'][:12]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v14inv-summary-${{ github.run_id }}
          path: summary/
          retention-days: 90
          if-no-files-found: error
