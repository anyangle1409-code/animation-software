name: ORIGINAL_v1 R39 approved straight arm-to-body line
on:
  push:
    branches: [claude/original-v1-consolidated-review-20261014]
    paths:
      - '.github/workflows/original-review-r39.yml'
      - 'scripts/tests/test_original_review_r38_marks.py'
      - 'scripts/original_review_r39_target.py'
      - 'scripts/original_review_r39_line.py'
      - 'scripts/original_review_r39_checks.py'
      - 'scripts/tests/test_original_review_r39_checks.py'
      - 'scripts/tests/test_original_review_r39_line.py'
      - 'scripts/export_original_review_r39_blender.py'
      - 'scripts/solve_original_review_r39.py'
      - 'scripts/redistribute_original_review_r39.py'
      - 'scripts/optimize_original_review_r39.py'
      - 'scripts/detect_original_review_r39_contacts_blender.py'
      - 'scripts/tests/test_original_review_r39_optimizer.py'
      - 'scripts/tests/test_original_review_r39_solver.py'
      - 'scripts/probe_original_review_r35_blender.py'
      - 'scripts/original_review_contour.py'
      - 'scripts/original_review_r35_reports.py'
      - 'scripts/tests/test_original_review_r35_reporting.py'
      - 'scripts/build_original_review_candidate_r39_blender.py'
      - 'scripts/render_original_review_r39_blender.py'
      - 'scripts/package_original_review_r39.py'
      - 'scripts/measure_original_review_r39_orientation_blender.py'
      - 'scripts/original_review_candidate_checks.py'
      - 'scripts/tests/test_original_review_candidate_reporting.py'
concurrency:
  group: original-v1-r39-candidate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-review-r39:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb ffmpeg python3-pil python3-scipy fonts-dejavu-core
      - name: Install pinned Blender 5.2.1
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Verify immutable parent model hash
        run: |
          /usr/bin/python3 - <<'PYHASH'
          import hashlib,json
          from pathlib import Path
          p=Path('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017')
          assert hashlib.sha256((p/'HGPT_ORIGINAL_V1_REVIEW_R38_CODEX.blend').read_bytes()).hexdigest()==json.loads((p/'r38_build.json').read_text())['sha256']
          PYHASH
      - name: Export parent geometry in a clean Blender process
        run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/export_original_review_r39_blender.py
      - name: Confirm R38 fails the approved line goals
        run: |
          set +e
          export HGPT_CONTOUR_NPZ=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/probe/r35_contour_surfaces.npz
          export HGPT_LINE_PARENT_NPZ="$HGPT_CONTOUR_NPZ"
          /usr/bin/python3 scripts/tests/test_original_review_r39_line.py > /tmp/r39-parent-red.txt 2>&1
          result=$?
          cat /tmp/r39-parent-red.txt
          test "$result" = 1
          grep -q 'FAILED (failures=4)' /tmp/r39-parent-red.txt
      - name: Verify reporting failure cases
        run: |
          /usr/bin/python3 -m unittest discover -s scripts/tests -p test_original_review_candidate_reporting.py
          /usr/bin/python3 -m unittest discover -s scripts/tests -p test_original_review_r35_reporting.py
          /usr/bin/python3 scripts/tests/test_original_review_r39_solver.py
          /usr/bin/python3 scripts/tests/test_original_review_r39_checks.py
          /usr/bin/python3 scripts/tests/test_original_review_r39_optimizer.py
      - name: Solve coupled material-area constraints for both paths
        run: /usr/bin/python3 scripts/solve_original_review_r39.py /tmp/r39-response/response.npz /tmp/r39-response/solved.npz
      - name: Resolve native BVH contacts before unchanged guards
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/r39-response
          blender=/tmp/blender-5.2.1-linux-x64/blender
          for iteration in 0 1 2 3 4; do
            contact="$out/contacts_$iteration.json"
            "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/detect_original_review_r39_contacts_blender.py -- "$out/response.npz" "$out/solved.npz" "$contact"
            if /usr/bin/python3 -c 'import json,sys; raise SystemExit(bool(json.load(open(sys.argv[1]))["contacts"]))' "$contact"; then break; fi
            /usr/bin/python3 - "$contact" "$out/contacts_active.json" <<'PYCONTACT'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[2]);rows=json.loads(p.read_text())['contacts'] if p.exists() else []
          rows+=json.load(open(sys.argv[1]))['contacts']
          unique={(r['sample'],r['a'],r['b']):r for r in rows}
          p.write_text(json.dumps({'contacts':list(unique.values())},indent=2))
          PYCONTACT
            /usr/bin/python3 scripts/solve_original_review_r39.py "$out/response.npz" "$out/solved.npz" "$out/contacts_active.json"
          done
          "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/detect_original_review_r39_contacts_blender.py -- "$out/response.npz" "$out/solved.npz" "$out/contacts_final.json"
          /usr/bin/python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["sample_count"]==82 and not r["contacts"], r["contacts"]' "$out/contacts_final.json"
      - name: Build separate R39 with original guards
        if: hashFiles('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/HGPT_ORIGINAL_V1_REVIEW_R39_CODEX.blend') == ''
        run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/build_original_review_candidate_r39_blender.py -- build
      - name: Run fixed front goals on R39 and retain failures
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export HGPT_FRONT_TEST_BLEND=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/HGPT_ORIGINAL_V1_REVIEW_R39_CODEX.blend
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017
          /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r34_front.py 2>&1 | tee "$out/front_test.txt"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$out/front_test_exit.txt"
          exit 0
      - name: Verify saved model against its build hash
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          d = Path('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017')
          expected = json.loads((d / 'r39_build.json').read_text())['sha256']
          actual = hashlib.sha256((d / 'HGPT_ORIGINAL_V1_REVIEW_R39_CODEX.blend').read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          PY
      - name: Check preservation and measure both paths in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          blender=/tmp/blender-5.2.1-linux-x64/blender
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017
          r34=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r34_20261016/HGPT_ORIGINAL_V1_REVIEW_R34_CODEX.blend
          r39="$out/HGPT_ORIGINAL_V1_REVIEW_R39_CODEX.blend"
          "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- identity "$r39" "$out/identity.json"
          base=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r34_20261016
          /usr/bin/python3 - <<'PYHASH'
          import hashlib,json
          from pathlib import Path
          p=Path('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r34_20261016')
          assert hashlib.sha256((p/'HGPT_ORIGINAL_V1_REVIEW_R34_CODEX.blend').read_bytes()).hexdigest()==json.loads((p/'r34_build.json').read_text())['sha256']
          PYHASH
          cp "$base/r34_press.json" "$out/r34_press.json"
          cp "$base/r34_benchmarks.json" "$out/r34_benchmarks.json"
          "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- press "$r39" "$out/r39_press.json"
          "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- benchmarks "$r39" "$out/r39_benchmarks.json"
      - name: Recheck both original guard baselines on the final saved model
        run: |
          /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- guard ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/HGPT_ORIGINAL_V1_REVIEW_R39_CODEX.blend ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/r39_guard_recheck.json
      - name: Recheck final saved-model orientation against parent at all82poses
        run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r39_orientation_blender.py
      - name: Render matching press views in fresh processes
        if: hashFiles('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/r38_r39_same_angle_comparison.jpg') == '' || hashFiles('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/shoulder_press_r39_three_views.mp4') == ''
        shell: bash
        run: |
          set -euo pipefail
          blender=/tmp/blender-5.2.1-linux-x64/blender
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017
          r38=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/HGPT_ORIGINAL_V1_REVIEW_R38_CODEX.blend
          r39="$out/HGPT_ORIGINAL_V1_REVIEW_R39_CODEX.blend"
          for version in r38 r39; do
            model="$r38"
            if [ "$version" = r39 ]; then model="$r39"; fi
            xvfb-run -a "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/render_original_review_r39_blender.py -- "$model" "/tmp/r39-frames/$version"
          done
      - name: Measure final saved-model contour and retain all test failures
        shell: bash
        run: |
          set -euo pipefail
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017
          /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/probe_original_review_r35_blender.py -- "$out/HGPT_ORIGINAL_V1_REVIEW_R39_CODEX.blend" "$out/probe"
          set +e
          HGPT_CONTOUR_NPZ="$out/probe/r35_contour_surfaces.npz" /usr/bin/python3 scripts/tests/test_original_review_r37_contour.py > "$out/contour_test.txt" 2>&1
          result=$?
          printf '%s\n' "$result" > "$out/contour_test_exit.txt"
          cat "$out/contour_test.txt"
          HGPT_CONTOUR_NPZ="$out/probe/r35_contour_surfaces.npz" /usr/bin/python3 scripts/tests/test_original_review_r38_marks.py > "$out/marks_test.txt" 2>&1
          result=$?
          printf '%s\n' "$result" > "$out/marks_test_exit.txt"
          cat "$out/marks_test.txt"
          export HGPT_LINE_PARENT_NPZ=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/probe/r35_contour_surfaces.npz
          HGPT_CONTOUR_NPZ="$out/probe/r35_contour_surfaces.npz" /usr/bin/python3 scripts/tests/test_original_review_r39_line.py > "$out/line_test.txt" 2>&1
          result=$?
          printf '%s\n' "$result" > "$out/line_test_exit.txt"
          cat "$out/line_test.txt"


      - name: Render exact junction closeups for both versions
        shell: bash
        run: |
          set -euo pipefail
          blender=/tmp/blender-5.2.1-linux-x64/blender
          for version in r38 r39; do
            date=20261017
            if [ "$version" = r39 ]; then date=20261017; fi
            model="ORIGINAL_V1_WORK/anatomy/candidates/codex_review_${version}_${date}/HGPT_ORIGINAL_V1_REVIEW_${version^^}_CODEX.blend"
            xvfb-run -a "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/render_original_review_r39_blender.py -- "$model" "/tmp/r39-junction/$version" junction_closeups
            xvfb-run -a "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/render_original_review_r39_blender.py -- "$model" "/tmp/r39-front/$version" front_closeups
          done
      - name: Package every regression, comparison and video
        run: /usr/bin/python3 scripts/package_original_review_r39.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v1-r39-review-evidence
          path: |
            /tmp/r39-response/
            /tmp/r39-junction/
            /tmp/r39-front/
            ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/
            docs/CODEX_ORIGINAL_V1_REVIEW_CANDIDATE_R39_20261017.md
      - name: Preserve candidate and evidence on the requested branch
        shell: bash
        run: |
          set -euo pipefail
          branch=claude/original-v1-consolidated-review-20261014
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017 docs/CODEX_ORIGINAL_V1_REVIEW_CANDIDATE_R39_20261017.md
          git commit -m 'Preserve R39 review experiment with tests, metrics, comparisons and video'
          git push origin "HEAD:$branch"
      - name: Require numerical success without hiding rejected experiments
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r39_20261017/r39_review.json')
          report = json.loads(p.read_text())
          assert report['status'] == 'NUMERIC_CHECKS_PASSED_AWAITING_VISUAL_REVIEW', report['status']
          PY



