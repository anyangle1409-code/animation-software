name: ChatGPT curl motion report
on:
  push:
    branches: [chatgpt/absolute-retarget-imports]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print current retained curl motion report
        run: npx vitest run src/editor/curlMotionReport.test.ts --reporter=verbose
      - name: Remove temporary report scaffolding
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm src/editor/curlMotionReport.test.ts .github/workflows/chatgpt-curl-report.yml
          git commit -m "chore: remove temporary curl motion report" || true
          git push
