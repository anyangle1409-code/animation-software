name: ChatGPT validate shoulder muscle biomechanics
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged shoulder biomechanics fix
        run: python .github/chatgpt_shoulder_muscle_fix.py
      - name: Calibrate visible belly containment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/muscles/model.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("origin: at('clavicle_l', 0.03, 0.15, 0),\n    insertion: at('upperarm_l', 0.05, 0.11, 0),\n    thickness: 0.042", "origin: at('clavicle_l', 0.03, 0.15, 0),\n    insertion: at('upperarm_l', 0.05, 0.11, 0),\n    thickness: 0.0415")
          text = text.replace("origin: at('spine_03', -0.025, 0.1, 0.12),\n    insertion: at('upperarm_l', 0, 0.05, 0.01),\n    thickness: 0.032", "origin: at('spine_03', -0.025, 0.1, 0.12),\n    insertion: at('upperarm_l', 0, 0.05, 0.01),\n    thickness: 0.0319")
          path.write_text(text, encoding='utf-8')
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated changes and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/muscles/model.ts src/muscles/functions.test.ts
          git rm .github/chatgpt_shoulder_muscle_fix.py .github/workflows/chatgpt-muscle-actions.yml
          git commit -m "feat: correct shoulder muscle functional paths"
          git push
