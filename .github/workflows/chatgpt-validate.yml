name: ChatGPT validate resolved bilateral motion symmetry
on:
  push:
    branches: [chatgpt/absolute-retarget-imports]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged bilateral motion diagnostics
        run: python .github/chatgpt_bilateral_motion.py
      - name: Correct bilateral fixture to legal forearm axes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/editor/motionDiagnostics.test.ts')
          text = p.read_text()
          text = text.replace(
              "vec3(0, (30 * Math.PI) / 180, (5 * Math.PI) / 180)",
              "vec3(0, (30 * Math.PI) / 180, 0)",
          ).replace(
              "vec3(0, (-30 * Math.PI) / 180, (-5 * Math.PI) / 180)",
              "vec3(0, (-30 * Math.PI) / 180, 0)",
          )
          p.write_text(text)

          p = Path('AI_CHANGELOG.md')
          text = p.read_text().replace(
              'a synthetic forearm path containing flexion plus handed Y/Z rotation',
              'a synthetic forearm path containing flexion plus handed axial rotation',
          )
          p.write_text(text)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated bilateral motion diagnostics and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/motionDiagnostics.ts src/editor/motionDiagnostics.test.ts src/editor/panels/JointPanel.tsx docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_bilateral_motion.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add resolved bilateral motion diagnostics"
          git push
