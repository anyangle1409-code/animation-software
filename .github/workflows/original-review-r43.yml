name: ORIGINAL_v1 R43 whole-motion fit and native review
'on':
  push:
    branches:
    - claude/original-v1-consolidated-review-20261014
    paths:
    - .github/workflows/original-review-r43.yml
permissions:
  contents: write
  actions: read
jobs:
  native-study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@v4
    - name: Refuse to overwrite an existing R43 candidate or study
      run: 'test ! -e ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017

        test ! -e ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_study_20261017'
    - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
        xvfb ffmpeg python3-pil python3-scipy fonts-dejavu-core
    - name: Install pinned Blender 5.2.1
      run: 'curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
        --output /tmp/blender.tar.xz

        echo ''a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz''
        | sha256sum -c -

        tar -xJf /tmp/blender.tar.xz -C /tmp

        '
    - name: Verify immutable parent model hash
      run: '/usr/bin/python3 - <<''PYHASH''

        import hashlib,json

        from pathlib import Path

        p=Path(''ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r41_20261017'')

        assert hashlib.sha256((p/''HGPT_ORIGINAL_V1_REVIEW_R41_CODEX.blend'').read_bytes()).hexdigest()==json.loads((p/''r41_build.json'').read_text())[''sha256'']

        PYHASH

        '
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r42-native-response
        run-id: 39048442821
        github-token: ${{ github.token }}
        path: /tmp/r42-response
    - name: Prepare whole-motion fit and verify numerical helpers
      run: '/usr/bin/python3 scripts/prepare_original_review_r42.py /tmp/r42-response/response.npz
        /tmp/r42-response/prepared.npz --absolute-cap

        mkdir -p /tmp/r43-response

        /usr/bin/python3 scripts/prepare_original_review_r43.py /tmp/r42-response/prepared.npz
        scripts/data/r42_study_delta_20261017.npz /tmp/r43-response/source.npz

        /usr/bin/python3 - <<''PYZERO''

        import numpy as np

        z=np.load(''/tmp/r43-response/source.npz'');np.savez_compressed(''/tmp/r43-response/zero.npz'',delta=np.zeros((7,len(z[''rest'']),3)))

        PYZERO

        for name in sampling gradients lp; do /usr/bin/python3 "scripts/tests/test_original_review_r43_${name}.py";
        done

        '
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r42-unsaved-contour-study
        run-id: 39073116321
        github-token: ${{ github.token }}
        path: /tmp/r42-previous
    - name: Fit body motion without relaxing acceptance gates
      shell: bash
      run: "set +e\n/usr/bin/python3 - <<'PYCONTACT'\nimport json\nfrom pathlib import\
        \ Path\np=Path('/tmp/r42-previous/r42-study/native_contacts.json');z=json.loads(p.read_text());Path('/tmp/r43-response/r42_contacts.json').write_text(json.dumps(z))\n\
        PYCONTACT\ntimeout 4800 /usr/bin/python3 -u scripts/solve_original_review_r43.py\
        \ /tmp/r43-response/source.npz /tmp/r43-response/zero.npz ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/probe/r35_contour_surfaces.npz\
        \ /tmp/r43-response/r42_contacts.json /tmp/r43-response/solved.npz > /tmp/r43-response/fit.log\
        \ 2>&1\nresult=$?\nprintf '%s\\n' \"$result\" > /tmp/r43-response/solver_exit.txt\n\
        if [ ! -f /tmp/r43-response/solved.npz ]; then\n if [ -f /tmp/r43-response/solved.npz.progress.npz\
        \ ]; then cp /tmp/r43-response/solved.npz.progress.npz /tmp/r43-response/solved.npz;\
        \ else cp /tmp/r43-response/zero.npz /tmp/r43-response/solved.npz; fi\nfi\n\
        tail -50 /tmp/r43-response/fit.log\nexit 0\n"
    - name: Preserve whole-motion and scope test results
      shell: bash
      run: "set +e\nexport HGPT_R43_RESPONSE=/tmp/r43-response/source.npz HGPT_R43_SOLUTION=/tmp/r43-response/solved.npz\n\
        for name in preservation motion back_surface; do\n /usr/bin/python3 \"scripts/tests/test_original_review_r43_${name}.py\"\
        \ >\"/tmp/r43-response/r43_${name}_test.txt\" 2>&1\n printf '%s\\n' \"$?\"\
        \ >\"/tmp/r43-response/r43_${name}_test_exit.txt\"\n cat \"/tmp/r43-response/r43_${name}_test.txt\"\
        \ndone\nexit 0\n"
    - name: Measure all83 actual native responses before saving
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads
        2 --python-exit-code 1 --python scripts/detect_original_review_r43_contacts_blender.py
        -- /tmp/r43-response/source.npz /tmp/r43-response/solved.npz /tmp/r43-response/native_final.json
    - name: Run all13 original movement benchmarks before saving
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads
        2 --python-exit-code 1 --python scripts/validate_original_review_r43_benchmarks_blender.py
        -- /tmp/r43-response/source.npz /tmp/r43-response/solved.npz /tmp/r43-response/benchmarks_before_save.json
    - name: Save model only after all pre-save gates
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads
        2 --python-exit-code 1 --python scripts/build_original_review_candidate_r43_blender.py
      continue-on-error: true
    - name: Recheck saved identity and original82-pose guards
      shell: bash
      run: "set +e\nif [ -f ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017/HGPT_ORIGINAL_V1_REVIEW_R43_CODEX.blend\
        \ ]; then\n /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup\
        \ --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py\
        \ -- identity ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017/HGPT_ORIGINAL_V1_REVIEW_R43_CODEX.blend\
        \ ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017/identity.json\n\
        \ printf '%s\\n' \"$?\" > /tmp/r43-response/identity_test_exit.txt\n /tmp/blender-5.2.1-linux-x64/blender\
        \ --background --factory-startup --threads 2 --python-exit-code 1 --python\
        \ scripts/measure_original_review_r34_blender.py -- guard ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017/HGPT_ORIGINAL_V1_REVIEW_R43_CODEX.blend\
        \ ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017/r43_guard_recheck.json\n\
        \ printf '%s\\n' \"$?\" > /tmp/r43-response/original_guard_test_exit.txt\n\
        fi\nexit 0\n"
    - name: Render actual saved model or clearly identified unsaved study
      shell: bash
      run: 'model=""

        if [ -f ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017/HGPT_ORIGINAL_V1_REVIEW_R43_CODEX.blend
        ]; then model=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43_20261017/HGPT_ORIGINAL_V1_REVIEW_R43_CODEX.blend;
        fi

        xvfb-run -a /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup
        --threads 2 --python-exit-code 1 --python scripts/render_original_review_r43_blender.py
        -- /tmp/r43-response/source.npz /tmp/r43-response/solved.npz /tmp/r43-study
        $model

        '
    - name: Run unchanged profile and contour acceptance tests
      shell: bash
      run: "set +e\nexport HGPT_CONTOUR_NPZ=/tmp/r43-study/R43/native_probe.npz\n\
        export HGPT_LINE_PARENT_NPZ=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/probe/r35_contour_surfaces.npz\n\
        for name in r42_profile r37_contour r38_marks r41_line r41_front; do\n /usr/bin/python3\
        \ \"scripts/tests/test_original_review_${name}.py\" >\"/tmp/r43-response/${name}_test.txt\"\
        \ 2>&1\n printf '%s\\n' \"$?\" >\"/tmp/r43-response/${name}_test_exit.txt\"\
        \n cat \"/tmp/r43-response/${name}_test.txt\"\ndone\nexit 0\n"
    - name: Package native matching-angle images and two press videos
      run: /usr/bin/python3 scripts/package_original_review_r43.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: original-v1-r43-whole-motion-review
        path: '/tmp/r43-response/

          /tmp/r43-study/

          ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43*20261017/'
        retention-days: 14
    - name: Commit native evidence on the authorized branch without force
      run: 'git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r43*20261017/ docs/CODEX_ORIGINAL_V1_REVIEW_CANDIDATE_R43_20261017.md

        git commit -m ''R43 native full-motion review evidence; retain numerical failures
        and owner review pending''

        git push origin HEAD:claude/original-v1-consolidated-review-20261014

        '
    - name: Require all acceptance gates after preserving evidence
      run: '/usr/bin/python3 - <<''PYREQUIRE''

        from pathlib import Path

        import json

        paths=list(Path(''ORIGINAL_V1_WORK/anatomy/candidates'').glob(''codex_review_r43*20261017/r43_review.json''))

        assert len(paths)==1

        z=json.loads(paths[0].read_text());assert z[''status'']==''NUMERIC_CHECKS_PASSED_AWAITING_VISUAL_REVIEW'',z[''status'']

        PYREQUIRE

        '
