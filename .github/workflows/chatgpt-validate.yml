name: ChatGPT validate corrective inspection

on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
    paths:
      - '.github/chatgpt_corrective_workspace.py'
      - '.github/workflows/chatgpt-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged corrective inspection workspace
        run: python .github/chatgpt_corrective_workspace.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated corrective inspection and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/character/correctiveDiagnostics.ts src/character/correctiveDiagnostics.test.ts src/editor/characterStore.ts src/viewer/CharacterFigure.tsx src/editor/panels/CorrectivePanel.tsx src/editor/App.tsx src/editor/styles.css docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_corrective_workspace.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add corrective deformation inspection workspace"
          git push
