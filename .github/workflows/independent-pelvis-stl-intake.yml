name: Independent anatomical mesh intake audit

on:
  push:
    branches:
      - codex/independent-pelvis-stl-intake-20261009
  pull_request:
    paths:
      - 'scripts/anatomy_fit/stl_bone_mesh_intake.py'
      - 'scripts/test_stl_bone_mesh_intake.py'
      - 'ORIGINAL_V1_WORK/anatomy/audit/nih3d_male_pelvis_mesh_source_manifest_20261009.json'
      - '.github/workflows/independent-pelvis-stl-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect synthetic binary and ASCII STL with no third-party packages
        run: python3 -m unittest discover -s scripts -p 'test_stl_bone_mesh_intake.py' -v
      - name: Preserve osseous APP and source-registry regression tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_external_trunk_landmark_bridge.py' -v
          python3 -m unittest discover -s scripts -p 'test_pelvic_app_bone_frame.py' -v
          python3 -m unittest discover -s scripts -p 'test_bone_feature_observation_packet.py' -v
          python3 -m unittest discover -s scripts -p 'test_bone_geometry_source_acquisition.py' -v
      - name: Preserve previous coupled trunk diagnostic tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_coupled_trunk_preflight.py' -v
          python3 -m unittest discover -s scripts -p 'test_replay_p004_coupled_thorax.py' -v
          python3 -m unittest discover -s scripts -p 'test_replay_p005_shoulder_chain.py' -v
          python3 -m unittest discover -s scripts -p 'test_rib_3d_coupling_audit.py' -v
          python3 -m unittest discover -s scripts -p 'test_p006_sternocostal_translation_feasibility.py' -v
          python3 -m unittest discover -s scripts -p 'test_p007_sternum_rigid_fit_audit.py' -v
          python3 -m unittest discover -s scripts -p 'test_neutral_arm_thigh_clearance.py' -v
