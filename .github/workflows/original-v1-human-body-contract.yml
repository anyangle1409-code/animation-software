name: ORIGINAL v1 human-body contract

on:
  push:
    paths:
      - "ORIGINAL_V1_HUMAN_BODY_*.json"
      - "ORIGINAL_V1_HUMAN_EVIDENCE_MANIFEST.json"
      - "ORIGINAL_V1_HUMAN_MOVEMENT_SWEEP_PLAN.json"
      - "ORIGINAL_V1_ANATOMICAL_COUPLING_*.json"
      - "ORIGINAL_V1_WHOLE_BODY_ISSUE_LEDGER.json"
      - "ORIGINAL_V1_DEFECT_COUPLING_MAP.json"
      - "ORIGINAL_V1_JOINT_TISSUE_TRIGGER_MAP.json"
      - "ORIGINAL_V1_COUPLING_ZONE_DECLARATION_TEMPLATE.json"
      - "docs/ORIGINAL_V1_HUMAN_BODY_*.md"
      - "docs/ORIGINAL_V1_ANATOMICAL_COUPLING_CONTRACT.md"
      - "scripts/*human_body*"
      - "scripts/*human_evidence*"
      - "scripts/*human_movement*"
      - "scripts/*anatomical_coupling*"
      - "scripts/*shoulder_layer_diagnostic*"
      - "scripts/*joint_tissue*"
      - "scripts/*defect_coupling*"
      - "scripts/*coupling_zone*"
      - "ORIGINAL_V1_ANATOMICAL_REPAIR_PACKAGES.json"
      - "ORIGINAL_V1_DEFORMATION_DIAGNOSIS_TREE.json"
      - "ORIGINAL_V1_WEIGHTS_ONLY_ACCEPTANCE_*.json"
      - "ORIGINAL_V1_POSE_MOVEMENT_FAMILY_MAP.json"
      - "ORIGINAL_V1_CANDIDATE_COMPARISON_MANIFEST_TEMPLATE.json"
      - "docs/ORIGINAL_V1_WHOLE_BODY_REPAIR_GUIDE.md"
      - "scripts/*weights_only*"
      - "scripts/*deformation_diagnosis*"
      - "scripts/*pose_evidence*"
      - "scripts/*candidate_comparison*"
      - "scripts/*anatomical_repair*"
      - "ORIGINAL_V1_STAGE1_REPAIR_EXECUTION_GRAPH.json"
      - "ORIGINAL_V1_DEFORMATION_FAILURE_SIGNATURES.json"
      - "scripts/*repair_regression*"
      - "scripts/*skinning_ab*"
      - "scripts/*pre_repair_diagnostic*"
      - ".github/workflows/original-v1-human-body-contract.yml"
  pull_request:
    paths:
      - "ORIGINAL_V1_HUMAN_BODY_*.json"
      - "ORIGINAL_V1_HUMAN_EVIDENCE_MANIFEST.json"
      - "ORIGINAL_V1_HUMAN_MOVEMENT_SWEEP_PLAN.json"
      - "ORIGINAL_V1_ANATOMICAL_COUPLING_*.json"
      - "ORIGINAL_V1_WHOLE_BODY_ISSUE_LEDGER.json"
      - "ORIGINAL_V1_DEFECT_COUPLING_MAP.json"
      - "ORIGINAL_V1_JOINT_TISSUE_TRIGGER_MAP.json"
      - "ORIGINAL_V1_COUPLING_ZONE_DECLARATION_TEMPLATE.json"
      - "docs/ORIGINAL_V1_HUMAN_BODY_*.md"
      - "docs/ORIGINAL_V1_ANATOMICAL_COUPLING_CONTRACT.md"
      - "scripts/*human_body*"
      - "scripts/*human_evidence*"
      - "scripts/*human_movement*"
      - "scripts/*anatomical_coupling*"
      - "scripts/*shoulder_layer_diagnostic*"
      - "scripts/*joint_tissue*"
      - "scripts/*defect_coupling*"
      - "scripts/*coupling_zone*"
      - "ORIGINAL_V1_ANATOMICAL_REPAIR_PACKAGES.json"
      - "ORIGINAL_V1_DEFORMATION_DIAGNOSIS_TREE.json"
      - "ORIGINAL_V1_WEIGHTS_ONLY_ACCEPTANCE_*.json"
      - "ORIGINAL_V1_POSE_MOVEMENT_FAMILY_MAP.json"
      - "ORIGINAL_V1_CANDIDATE_COMPARISON_MANIFEST_TEMPLATE.json"
      - "docs/ORIGINAL_V1_WHOLE_BODY_REPAIR_GUIDE.md"
      - "scripts/*weights_only*"
      - "scripts/*deformation_diagnosis*"
      - "scripts/*pose_evidence*"
      - "scripts/*candidate_comparison*"
      - "scripts/*anatomical_repair*"
      - "ORIGINAL_V1_STAGE1_REPAIR_EXECUTION_GRAPH.json"
      - "ORIGINAL_V1_DEFORMATION_FAILURE_SIGNATURES.json"
      - "scripts/*repair_regression*"
      - "scripts/*skinning_ab*"
      - "scripts/*pre_repair_diagnostic*"
      - ".github/workflows/original-v1-human-body-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate human evidence
        run: python scripts/validate_original_v1_human_evidence.py
      - name: Validate human-body master plan
        run: python scripts/validate_original_v1_human_body_master_plan.py
      - name: Validate movement sweeps
        run: python scripts/validate_original_v1_human_movement_sweeps.py
      - name: Validate anatomical coupling map
        run: python scripts/validate_original_v1_anatomical_coupling.py
      - name: Validate first-party deformation architecture
        run: python scripts/validate_original_v1_first_party_deformation_architecture.py
      - name: Validate surface visual evidence requirements
        run: python scripts/validate_original_v1_surface_visual_evidence_requirements.py
      - name: Validate joint-to-tissue trigger map
        run: python scripts/validate_original_v1_joint_tissue_triggers.py
      - name: Validate anatomical coupling capture plan
        run: python scripts/validate_original_v1_anatomical_coupling_capture_plan.py
      - name: Validate blocking defect-to-coupling map
        run: python scripts/validate_original_v1_defect_coupling_map.py
      - name: Validate anatomical repair packages
        run: python scripts/validate_original_v1_anatomical_repair_packages.py
      - name: Validate deformation diagnosis tree
        run: python scripts/validate_original_v1_deformation_diagnosis_tree.py
      - name: Validate weights-only acceptance contract
        run: python scripts/validate_original_v1_weights_only_contract.py
      - name: Validate pose evidence planning authorities
        run: python scripts/validate_original_v1_pose_evidence_planning.py
      - name: Validate candidate comparison template
        run: python scripts/validate_original_v1_candidate_comparison_template.py
      - name: Validate Stage 1 repair execution graph
        run: python scripts/validate_original_v1_stage1_repair_execution_graph.py
      - name: Validate deformation failure signature guide
        run: python scripts/validate_original_v1_deformation_failure_signatures.py
      - name: Run surface visual evidence requirement tests
        run: python scripts/test_validate_original_v1_surface_visual_evidence_requirements.py
      - name: Run human evidence tests
        run: python scripts/test_original_v1_human_evidence.py
      - name: Run master-plan tests
        run: python scripts/test_validate_original_v1_human_body_master_plan.py
      - name: Run movement-sweep tests
        run: python scripts/test_validate_original_v1_human_movement_sweeps.py
      - name: Run anatomical-coupling map tests
        run: python scripts/test_validate_original_v1_anatomical_coupling.py
      - name: Run deformation-architecture tests
        run: python scripts/test_validate_original_v1_first_party_deformation_architecture.py
      - name: Run joint-to-tissue trigger tests
        run: python scripts/test_validate_original_v1_joint_tissue_triggers.py
      - name: Run pose connected-tissue scope tests
        run: python scripts/test_validate_original_v1_pose_coupling_scope.py
      - name: Run coupling-zone declaration tests
        run: python scripts/test_validate_original_v1_coupling_zone_declaration.py
      - name: Run anatomical-coupling evidence tests
        run: python scripts/test_validate_original_v1_anatomical_coupling_evidence.py
      - name: Run shoulder-layer diagnostic validator tests
        run: python scripts/test_validate_original_v1_shoulder_layer_diagnostic.py
      - name: Run automatic pose evidence planner tests
        run: python scripts/test_build_original_v1_pose_capture_evidence_plan.py
      - name: Run unified candidate comparison tests
        run: python scripts/test_build_original_v1_candidate_comparison_report.py
      - name: Run repair regression planner tests
        run: python scripts/test_build_original_v1_repair_regression_plan.py
