name: ChatGPT validate deformation-aware visual review
on:
  push:
    branches: [chatgpt/absolute-retarget-imports]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged visual review identity fix
        run: python .github/chatgpt_visual_review_revision.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated visual review identity and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/characterStore.ts src/editor/characterStore.test.ts src/editor/store.ts src/editor/store.test.ts src/editor/panels/CorrectivePanel.tsx src/editor/panels/ReviewPanel.tsx docs/STUDIO_CAPABILITY_ROADMAP.md docs/BICEP_CURL_REVIEW_HANDOFF.md AI_CHANGELOG.md
          git rm .github/chatgpt_visual_review_revision.py .github/workflows/chatgpt-validate.yml
          git commit -m "fix: bind visual review to deformation state"
          git push
