name: ChatGPT changelog handoff
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  update-log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python .github/chatgpt_changelog_handoff.py
      - run: |
          git config user.name ChatGPT
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AI_CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: log focus and curl guardrail handoff'
          git push
