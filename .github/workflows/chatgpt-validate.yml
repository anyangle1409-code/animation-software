name: ChatGPT validate joint coordination diagnostics

on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
    paths:
      - '.github/chatgpt_joint_coordination_diagnostics.py'
      - '.github/workflows/chatgpt-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged joint coordination diagnostics
        run: python .github/chatgpt_joint_coordination_diagnostics.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated coordination diagnostics and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/coordinationDiagnostics.ts src/editor/coordinationDiagnostics.test.ts src/editor/panels/JointPanel.tsx docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_joint_coordination_diagnostics.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add joint coordination diagnostics"
          git push
