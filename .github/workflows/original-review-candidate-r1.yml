name: ORIGINAL_v1 consolidated review candidates R1-R6 (Claude)
on:
  push:
    branches: [claude/original-v1-consolidated-review-20261014]
  pull_request:
    paths: ['scripts/*review_candidate*', 'scripts/blender_tests/test_original_review_candidate_r1.py', 'ORIGINAL_V1_WORK/anatomy/candidates/claude_review_r1_20261014/**', 'ORIGINAL_V1_WORK/anatomy/candidates/claude_review_r2_20261014/**', 'scripts/build_original_shoulder_relax_corrective_blender.py', 'scripts/blender_tests/test_original_review_candidate_r2.py', 'scripts/blender_tests/test_original_review_candidate_r3.py', 'scripts/blender_tests/test_original_review_candidate_r4.py', 'scripts/blender_tests/test_original_review_candidate_r5.py', 'scripts/blender_tests/test_original_review_candidate_r6.py', 'ORIGINAL_V1_WORK/anatomy/candidates/claude_review_r6_20261014/**', 'ORIGINAL_V1_WORK/anatomy/candidates/claude_review_r5_20261014/**', 'scripts/build_original_arm_trunk_contact_corrective_blender.py', 'ORIGINAL_V1_WORK/anatomy/candidates/claude_review_r4_20261014/**', 'scripts/original_v1_shoulder_r4.py', 'scripts/original_v1_scapula_isb_drive.py', 'ORIGINAL_V1_WORK/anatomy/candidates/claude_review_r3_20261014/**', 'scripts/build_original_knee_contact_corrective_blender.py', '.github/workflows/original-review-candidate-r1.yml']
permissions:
  contents: read
jobs:
  native-review-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Install pinned Blender 5.2.1
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender-5.2.1-linux-x64.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender-5.2.1-linux-x64.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender-5.2.1-linux-x64.tar.xz -C /tmp
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r1.py
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r2.py
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r3.py
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend --threads 2 --python-exit-code 1 --python scripts/blender_tests/test_original_knee_contact_corrective.py
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r4.py
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r5.py
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r6.py
