name: ORIGINAL_v1 R53 authorised26 weight-only trial
'on':
  push:
    branches: [codex/r53-shoulder-root-cause-20261019]
    paths: [.github/workflows/original-r53-weight-trial-20261019.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: original-r53-weight-trial-20261019
  cancel-in-progress: false
jobs:
  native-weight-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HGPT_R53_RESPONSE: /tmp/r53-weight/source.npz
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb python3-pil python3-scipy fonts-dejavu-core ffmpeg
    - name: Install pinned Blender5.2.1
      run: |
        curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender.tar.xz
        echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz' | sha256sum -c -
        tar -xJf /tmp/blender.tar.xz -C /tmp
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r52-review
        run-id: 39215634074
        github-token: ${{ github.token }}
        path: /tmp/r52-input
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r53-root-cause-20261019
        run-id: 39264438580
        github-token: ${{ github.token }}
        path: /tmp/r53-capture
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r47-shape-study
        run-id: 39153244090
        github-token: ${{ github.token }}
        path: /tmp/r47-previous
    - name: Verify immutable inputs and focused tests
      run: |
        mkdir -p /tmp/r53-weight
        cp /tmp/r52-input/tmp/r52-response/source.npz /tmp/r53-weight/source.npz
        cp /tmp/r52-input/tmp/r52-response/solved.npz /tmp/r53-weight/solved.npz
        echo '2a6c01cf7eacd3d1ceb47ae9f131f76dd0487fce5d3518d5cd1df65bc059fa8d  /tmp/r53-weight/source.npz' | sha256sum -c -
        echo 'b3a6c404a944753facde5a92db8bc4547a1ca756960b6b82df2875f5e4eb804f  /tmp/r53-weight/solved.npz' | sha256sum -c -
        echo '4c44b1fe14aeefd9a976f45baada60b4b81aaaa7cd736a300ca7cede2b0aaf2e  ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r41_20261017/HGPT_ORIGINAL_V1_REVIEW_R41_CODEX.blend' | sha256sum -c -
        echo 'eaa2368df04b5e1b6bab27ed438349016348c487489c893ea0413bb6d17b784a  /tmp/r53-capture/r52/clip.npz' | sha256sum -c -
        echo '6821e11e84ea401d12569a4df17b583bbc20366c7def969e30468e5f47d4a983  /tmp/r53-capture/r41/clip.npz' | sha256sum -c -
        /usr/bin/python3 -m unittest discover -s scripts/tests -p 'test_original_review_r53*.py' -v 2>&1 | tee /tmp/r53-weight/unit_tests.txt
    - name: Native161 pose isolation and four-view renders
      run: |
        set +e
        timeout 18m xvfb-run -a /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/probe_original_review_r53_weights_blender.py -- /tmp/r53-weight/source.npz /tmp/r53-weight/solved.npz /tmp/r53-capture /tmp/r53-weight r52 > /tmp/r53-weight/render.log 2>&1
        code=$?
        echo "$code" > /tmp/r53-weight/render_exit.txt
        tail -12 /tmp/r53-weight/render.log
        exit "$code"
    - name: All83 native safety checks with actual-weight linear replay
      if: success() || failure()
      run: |
        set +e
        timeout 20m /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/detect_original_review_r53_weight_contacts_blender.py -- /tmp/r53-weight/source.npz /tmp/r53-weight/solved.npz /tmp/r53-weight/native_final.json > /tmp/r53-weight/native.log 2>&1
        code=$?
        echo "$code" > /tmp/r53-weight/native_exit.txt
        tail -12 /tmp/r53-weight/native.log
        exit "$code"
    - name: Original13 benchmark and161 temporal checks on actual patched model
      if: success() || failure()
      run: |
        failed=0
        for item in 'validate_original_review_r52_benchmarks_blender.py benchmarks' 'measure_original_review_r52_dense_motion_blender.py dense_motion'; do
          read -r script label <<< "$item"
          set +e
          timeout 8m /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/run_original_review_r53_weight_checks_blender.py -- "$script" /tmp/r53-weight/source.npz /tmp/r53-weight/solved.npz "/tmp/r53-weight/$label.json" > "/tmp/r53-weight/$label.log" 2>&1
          code=$?
          echo "$code" > "/tmp/r53-weight/${label}_exit.txt"
          tail -8 "/tmp/r53-weight/$label.log"
          if [ "$code" -ne 0 ]; then failed=1; fi
          set -e
        done
        exit "$failed"
    - name: Unchanged actual native and historical contour tests; retain every exit
      if: success() || failure()
      run: |
        mkdir -p /tmp/r52-study/R52
        if [ -f /tmp/r53-weight/r52/native_probe.npz ]; then cp /tmp/r53-weight/r52/native_probe.npz /tmp/r52-study/R52/native_probe.npz; fi
        /usr/bin/python3 scripts/run_original_review_r52_checks.py /tmp/r53-weight native
        /usr/bin/python3 scripts/run_original_review_r52_checks.py /tmp/r53-weight projection
    - name: Package actual before-after media; no saved model
      if: success() || failure()
      run: /usr/bin/python3 scripts/package_original_review_r53_weights.py /tmp/r53-capture /tmp/r53-weight
    - name: Require complete execution evidence, never infer acceptance
      if: success() || failure()
      run: /usr/bin/python3 scripts/report_original_review_r53_weights.py /tmp/r53-weight
    - name: Preserve all results including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: original-v1-r53-weight-trial-20261019
        path: /tmp/r53-weight/
        retention-days: 14
