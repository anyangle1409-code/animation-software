name: ORIGINAL v1 deformation validation

concurrency:
  group: original-v1-deformation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - claude/original-v1-blender-o2-20260929
    paths:
      - "ORIGINAL_V1_DEFORMATION_ACCEPTANCE.json"
      - "ORIGINAL_V1_CANDIDATE_STATUS.json"
      - "ORIGINAL_V1_WORK/candidates/DEFORMATION_BASELINE_R2.json"
      - "ORIGINAL_V1_WORK/candidates/O4_CANDIDATE_BUILD.json"
      - "ORIGINAL_V1_WORK/candidates/CANDIDATE_GLB_EXPORT.json"
      - "ORIGINAL_V1_WORK/candidates/HomeGymPT_Male_ORIGINAL_v1_CANDIDATE_BARE.glb"
      - "ORIGINAL_V1_WORK/candidates/HomeGymPT_Male_ORIGINAL_v1_CANDIDATE_DRESSED.glb"
      - "ORIGINAL_V1_WORK/hgpt_canonical_v4_original.json"
      - "ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json"
      - "ORIGINAL_V1_WORK/candidates/grip_test_report_r1.json"
      - "scripts/evaluate_original_v1_deformation_report.py"
      - "scripts/compare_original_v1_deformation_reports.py"
      - "scripts/audit_original_v1_shoulder_weights_blender.py"
      - "scripts/pose_test_original_v1_o4_candidate_blender.py"
      - "scripts/export_original_v1_candidate_glb_blender.py"
      - "scripts/verify_original_v1_deformation_baseline.py"
      - "scripts/build_original_v1_repair_queue.py"
      - "scripts/test_build_original_v1_repair_queue.py"
      - "scripts/audit_original_v1_candidate_glbs.py"
      - "scripts/test_audit_original_v1_candidate_glbs.py"
      - "scripts/verify_original_v1_candidate_status.py"
      - "scripts/test_verify_original_v1_candidate_status.py"
      - "scripts/test_evaluate_original_v1_deformation_report.py"
      - "scripts/test_compare_original_v1_deformation_reports.py"
      - ".github/workflows/original-v1-deformation-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      - name: Syntax-check deformation tooling
        run: >
          python3 -m py_compile
          scripts/evaluate_original_v1_deformation_report.py
          scripts/compare_original_v1_deformation_reports.py
          scripts/audit_original_v1_shoulder_weights_blender.py
          scripts/pose_test_original_v1_o4_candidate_blender.py
          scripts/export_original_v1_candidate_glb_blender.py
          scripts/verify_original_v1_deformation_baseline.py
          scripts/build_original_v1_repair_queue.py
          scripts/test_build_original_v1_repair_queue.py
          scripts/audit_original_v1_candidate_glbs.py
          scripts/test_audit_original_v1_candidate_glbs.py
          scripts/verify_original_v1_candidate_status.py
          scripts/test_verify_original_v1_candidate_status.py
          scripts/test_evaluate_original_v1_deformation_report.py
          scripts/test_compare_original_v1_deformation_reports.py

      - name: Run deformation tooling tests
        run: |
          python3 -m unittest discover -s scripts -p "test_*deformation*.py"
          python3 scripts/test_build_original_v1_repair_queue.py

      - name: Audit committed candidate GLBs
        run: |
          mkdir -p reports
          python3 scripts/audit_original_v1_candidate_glbs.py --json-out reports/original_v1_candidate_glb_audit.json
          python3 scripts/test_audit_original_v1_candidate_glbs.py

      - name: Verify candidate status contract
        run: |
          python3 scripts/verify_original_v1_candidate_status.py --json-out reports/original_v1_candidate_status_verify.json
          python3 scripts/test_verify_original_v1_candidate_status.py

      - name: Verify pinned R2 baseline
        run: python3 scripts/verify_original_v1_deformation_baseline.py

      - name: Verify repair queue ownership
        run: >
          python3 scripts/build_original_v1_repair_queue.py
          ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          --profile development_blocker
          --require-complete-ownership
          --expect-next-priority 1

      - name: Reproduce current development report
        run: >
          python3 scripts/evaluate_original_v1_deformation_report.py
          ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          --grip-report ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          --profile development_blocker
          --require-group core_five
          --report-only

      - name: Comparator self-check against pinned report
        run: >
          python3 scripts/compare_original_v1_deformation_reports.py
          ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          --baseline-grip-report ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          --candidate-grip-report ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          --profile development_blocker

      - name: Targeted shoulder-comparison self-check
        run: >
          python3 scripts/compare_original_v1_deformation_reports.py
          ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          ORIGINAL_V1_WORK/candidates/pose_test_report_r2.json
          --profile development_blocker
          --poses press_bottom,press_top,press_top_rhythm,squat_bottom,pullup_hang,pullup_hang_rhythm,pullup_top,pullup_bar
