name: Extension Prompt Generation Check

on:
  push:
    branches:
      - work/prompt-generation-extension-latest-20260925
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused generation tests
        run: npm test -- src/generation/parse.test.ts src/generation/generate.test.ts
      - name: Build
        run: npm run build
      - name: Full test suite
        run: npm test
