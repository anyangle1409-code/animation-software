name: ChatGPT validate animation workspace
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged animation workspace
        run: python .github/chatgpt_animation_workspace.py
      - name: Calibrate floating-point playback assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/editor/playback.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "    expect(advancePlaybackTime(4.9, 0.25, 5, true, null)).toEqual({ time: 0.15, ended: false });"
          new = "    const wrapped = advancePlaybackTime(4.9, 0.25, 5, true, null);\n    expect(wrapped.ended).toBe(false);\n    expect(wrapped.time).toBeCloseTo(0.15, 10);"
          if text.count(old) != 1:
              raise SystemExit('expected playback assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated workspace and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/store.ts src/editor/playback.ts src/editor/playback.test.ts src/editor/Timeline.tsx src/editor/panels/JointPanel.tsx src/editor/store.test.ts src/editor/styles.css src/viewer/Viewport.tsx docs/STUDIO_CAPABILITY_ROADMAP.md
          git rm .github/chatgpt_animation_workspace.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add joint timing and loop-range authoring"
          git push
