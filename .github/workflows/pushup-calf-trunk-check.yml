name: Pushup Calf Trunk Generation Check

on:
  push:
    branches:
      - work/generator-pushup-calf-trunk-20260925
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused generation and reference tests
        run: >
          npm test --
          src/generation/parse.test.ts
          src/generation/generate.test.ts
          src/reference/familyPacks.test.ts
          src/reference/generatorCoverage.test.ts
          src/reference/reviewManifest.test.ts
          src/reference/reviewCamera.test.ts
      - name: Build
        run: npm run build
      - name: Full test suite
        run: npm test
