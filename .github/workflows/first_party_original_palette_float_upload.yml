name: G4y original 67-joint float palette upload preflight
on:
  push:
    branches: [codex/g4y-original-palette-upload-probe-20261012]
  pull_request:
    paths:
      - src/viewer/firstPartyOriginalPaletteFloatUpload.mjs
      - tests/firstPartyOriginalPaletteFloatUpload.test.mjs
      - .github/workflows/first_party_original_palette_float_upload.yml
permissions:
  contents: read
jobs:
  isolated-palette-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node --test tests/firstPartyOriginalPaletteFloatUpload.test.mjs
      - run: node --test tests/firstPartyOriginalWebGL2Capability.test.mjs
