name: ORIGINAL_v1 R59 review media (stills + press video, committed for the owner)
'on':
  push:
    branches: [claude/home-gym-pt-animation-txux66]
    paths: [.github/workflows/shoulder-r59-review-media.yml, scripts/shoulder_r58/render_press_sequence_blender.py, scripts/shoulder_r58/compose_review_media.py]
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: original-v1-r59-review-media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      FRAMES: '40'
    steps:
    - name: Check out this branch (media are committed here)
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
    - name: Check out the pinned R57 study sources (model, installer, press pose)
      uses: actions/checkout@v4
      with:
        ref: 025d5f28fa7eba2064fba565b1c9b60119cdd2cb
        path: r57src
    - name: Install renderer, Blender 5.2.1, ffmpeg and Pillow
      run: |
        set -euo pipefail
        sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb ffmpeg python3-pil fonts-dejavu-core
        curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender.tar.xz
        echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz' | sha256sum -c -
        tar -xJf /tmp/blender.tar.xz -C /tmp
    - name: Download immutable R52 study
      uses: actions/download-artifact@v4
      with:
        name: original-v1-r52-review
        run-id: 39215634074
        github-token: ${{ github.token }}
        path: /tmp/r52
    - name: Download the R59 study (exact candidate that went through the gates)
      uses: actions/download-artifact@v4
      with:
        name: original-v1-r59-min-accel-study-20261020
        run-id: 39421297091
        github-token: ${{ github.token }}
        path: /tmp/r59
    - name: Verify inputs
      run: |
        set -euo pipefail
        echo '2a6c01cf7eacd3d1ceb47ae9f131f76dd0487fce5d3518d5cd1df65bc059fa8d  /tmp/r52/tmp/r52-response/source.npz' | sha256sum -c -
        echo 'b3a6c404a944753facde5a92db8bc4547a1ca756960b6b82df2875f5e4eb804f  /tmp/r52/tmp/r52-response/solved.npz' | sha256sum -c -
        ls -la /tmp/r59/candidate.npz
        sha256sum /tmp/r59/candidate.npz
    - name: Render R52 and R59 through the press (same model, cameras, poses)
      run: |
        set -euo pipefail
        for pair in "R52 /tmp/r52/tmp/r52-response/solved.npz" "R59 /tmp/r59/candidate.npz"; do
          set -- $pair
          xvfb-run -a /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/shoulder_r58/render_press_sequence_blender.py -- "$PWD/r57src" /tmp/r52/tmp/r52-response/source.npz "$2" /tmp/seq "$1" "$FRAMES" > /tmp/render_$1.log 2>&1 || { tail -40 /tmp/render_$1.log; exit 1; }
          grep PRESS_SEQUENCE_COMPLETE /tmp/render_$1.log
        done
    - name: Compose side-by-side stills and video
      run: python3 scripts/shoulder_r58/compose_review_media.py /tmp/seq review-assets/shoulder_r59 "$FRAMES"
    - name: Commit the review media to this branch
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add review-assets/shoulder_r59
        git commit -m "Shoulder R59 review media: R52 vs R59 stills and press video (rendered in CI, review only, not approved)"
        for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done
