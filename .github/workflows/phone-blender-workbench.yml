name: Phone Blender workbench
on:
  push:
    branches: [work/phone-blender-workbench-20261023]
    paths: ['scripts/phone_blender/**', 'scripts/cloud_body_analysis/**', '.github/workflows/phone-blender-workbench.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: phone-blender-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pose-state-w8:
    # First native W8 movement-state trial; an isolated in-memory probe.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 025d5f28fa7eba2064fba565b1c9b60119cdd2cb
          path: _r57
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native Blender 5.2 pose-probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 xvfb
          python -m pip install bpy==5.2.0 numpy scipy pillow
      - name: Verify unchanged reference code revision and pose report tests
        run: |
          test "$(git -C _r57 rev-parse HEAD)" = "025d5f28fa7eba2064fba565b1c9b60119cdd2cb"
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_pose_state_probe.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_squat_pose_state_probe.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_forearm_pose_state_probe.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_row_elbow_pose_state_probe.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_row_pinned_edges.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_corrective_edge_isolation.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_adjacent_edge_controls.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_native_control_views.py -v
      - name: Retrieve immutable W8 reconstruction
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12487119841'
          run-id: 39922636070
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/W8
      - name: Measure W8 terminal keys, reverse replay and explicit clear without model save
        run: |
          python scripts/phone_blender/pose_state_probe.py \
            --source-dir "${{ runner.temp }}/W8" \
            --r57-root "$GITHUB_WORKSPACE/_r57" \
            --out "$GITHUB_WORKSPACE/phone-pose-probe"
      - name: Measure frozen W8 authored squat controls without model save
        run: |
          python scripts/phone_blender/squat_pose_state_probe.py \
            --source-dir "${{ runner.temp }}/W8" \
            --r57-root "$GITHUB_WORKSPACE/_r57" \
            --out "$GITHUB_WORKSPACE/phone-squat-pose-probe"
      - name: Measure frozen W8 authored forearm controls without model save
        run: |
          python scripts/phone_blender/forearm_pose_state_probe.py \
            --source-dir "${{ runner.temp }}/W8" \
            --r57-root "$GITHUB_WORKSPACE/_r57" \
            --out "$GITHUB_WORKSPACE/phone-forearm-pose-probe"
      - name: Measure frozen W8 coupled row elbow controls without model save
        run: |
          python scripts/phone_blender/row_elbow_pose_state_probe.py \
            --source-dir "${{ runner.temp }}/W8" \
            --r57-root "$GITHUB_WORKSPACE/_r57" \
            --out "$GITHUB_WORKSPACE/phone-row-elbow-pose-probe"
      - name: Preserve observed W8 coupled row elbow-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-w8-row-elbow-pose-state-${{ github.run_id }}
          path: phone-row-elbow-pose-probe/
          retention-days: 90
          if-no-files-found: error
      - name: Render frozen native corrective comparisons in a separate process
        run: |
          python scripts/phone_blender/native_control_views.py \
            --snapshots "$GITHUB_WORKSPACE/_phone-control-snapshots" \
            --out "$GITHUB_WORKSPACE/phone-pose-probe/control_views" \
            --include-individual
      - name: Preserve observed W8 authored forearm-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-w8-forearm-pose-state-${{ github.run_id }}
          path: phone-forearm-pose-probe/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve evaluated snapshots for independent cloud render replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-w8-evaluated-snapshots-${{ github.run_id }}
          path: _phone-control-snapshots/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve observed W8 pose-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-w8-shoulder-pose-state-${{ github.run_id }}
          path: phone-pose-probe/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve observed W8 authored squat-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-w8-squat-pose-state-${{ github.run_id }}
          path: phone-squat-pose-probe/
          retention-days: 90
          if-no-files-found: error

  verify-actual-shoulder-driver-math:
    needs: [inspect, pose-state-w8]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test measured-pose vs actual-driver math semantics
        run: python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_verify_pose_driver_contract.py -v
      - name: Retrieve exactly this run's original W8 static driver properties
        uses: actions/download-artifact@v4
        with:
          name: phone-blender-W8-${{ github.run_id }}
          path: ${{ runner.temp }}/static
      - name: Retrieve exactly this run's nine-frame W8 observed pose states
        uses: actions/download-artifact@v4
        with:
          name: phone-w8-shoulder-pose-state-${{ github.run_id }}
          path: ${{ runner.temp }}/actual
      - name: Enforce measured-elevation driver consistency without anatomical approval
        run: |
          python scripts/cloud_body_analysis/verify_pose_driver_contract.py \
            --static "${{ runner.temp }}/static/W8/shoulder_activation_rules.json" \
            --actual "${{ runner.temp }}/actual/w8_shoulder_driver_pose_state.json" \
            --out phone-pose-consistency
      - name: Validate W8 nine-frame deformation timeline with optional observed K1 elbow channels
        run: |
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_pose_failure_timeline.py -v
          python scripts/cloud_body_analysis/pose_failure_timeline.py \
            --actual "${{ runner.temp }}/actual/w8_shoulder_driver_pose_state.json" \
            --out phone-pose-consistency
      - name: Cross-reference W8 static elbow keys with observed shoulder press (read-only)
        run: |
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_elbow_corrective_crosswalk.py -v
          python scripts/cloud_body_analysis/elbow_corrective_crosswalk.py \
            --endpoint "${{ runner.temp }}/static/W8/w8_elbow_edge_endpoint_weights_and_keys.json" \
            --pose "${{ runner.temp }}/actual/w8_shoulder_driver_pose_state.json" \
            --out phone-pose-consistency
      - name: Publish W8 driver consistency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-w8-driver-consistency-${{ github.run_id }}
          path: phone-pose-consistency/
          retention-days: 90
          if-no-files-found: warn

  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: W8
            artifact: '12487119841'
          - model: V14
            artifact: '12487932177'
          - model: R120
            artifact: '12488550235'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cloud Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python -m pip install bpy==5.2.0 numpy scipy
      - name: Retrieve preserved reconstruction
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.artifact }}
          run-id: 39922636070
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/model
      - name: Run isolated read-only task
        env:
          MODEL: ${{ matrix.model }}
          INPUT_DIR: ${{ runner.temp }}/model
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python scripts/phone_blender/task.py
      - name: Preserve phone-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-blender-${{ matrix.model }}-${{ github.run_id }}
          path: phone-results/
          retention-days: 90
          if-no-files-found: error
  compare-rest-audits:
    needs: [inspect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve this run's W8 V14 R120 read-only JSON reports
        uses: actions/download-artifact@v4
        with:
          pattern: phone-blender-*-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-audit-reports
          merge-multiple: true
      - name: Test and aggregate read-only evidence
        run: |
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_compare_reports.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_compare_rig_axes.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_forearm_chain_readiness.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_native_limb_chain_readiness.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_joint_frame_readiness.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_frame_math_contract.py -v
          python scripts/cloud_body_analysis/compare_reports.py --root "${{ runner.temp }}/phone-audit-reports" --out phone-comparison
          python scripts/cloud_body_analysis/compare_rig_axes.py --root "${{ runner.temp }}/phone-audit-reports" --out phone-comparison
          python scripts/cloud_body_analysis/forearm_chain_readiness.py --root "${{ runner.temp }}/phone-audit-reports" --out phone-comparison
          python scripts/cloud_body_analysis/native_limb_chain_readiness.py --root "${{ runner.temp }}/phone-audit-reports" --out phone-comparison
          python scripts/cloud_body_analysis/joint_frame_readiness.py --rig-root "${{ runner.temp }}/phone-audit-reports" --out phone-comparison
          python scripts/cloud_body_analysis/frame_math_contract.py --out phone-comparison
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_joint_chain_skin_preflight.py -v
          python scripts/cloud_body_analysis/joint_chain_skin_preflight.py --out phone-comparison
      - name: Preserve cross-model comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-rest-cross-model-${{ github.run_id }}
          path: phone-comparison/
          retention-days: 90
          if-no-files-found: error
  localize-native-movement-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install report-only dependencies
        run: python -m pip install numpy pillow
      - name: Verify independent failure-localization unit tests
        run: python -m unittest discover -s scripts/cloud_body_analysis/tests -v
      - name: Retrieve pinned W8 read-only visual evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12495910312'
          run-id: 39937882229
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native/W8
          merge-multiple: true
      - name: Retrieve pinned V14 read-only visual evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12494932817'
          run-id: 39937882229
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native/V14
          merge-multiple: true
      - name: Retrieve pinned R120 read-only visual evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12495970648'
          run-id: 39937882229
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native/R120
          merge-multiple: true
      - name: Retrieve pinned W8 read-only rig axes metadata
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12534047239'
          run-id: 40029398965
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native/rig-W8
          merge-multiple: true
      - name: Audit fixed rest-vertex W8 elbow PCA taper (NOT anatomical area)
        run: |
          python scripts/cloud_body_analysis/elbow_taper_audit.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --rig "${{ runner.temp }}/native/rig-W8/W8/rig_rest_axes_metadata.json" \
            --out phone-native-localization
      - name: Audit fixed-rest W8 elbow-region mesh edge continuity (not anatomical strain)
        run: |
          python scripts/cloud_body_analysis/elbow_edge_continuity.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --rig "${{ runner.temp }}/native/rig-W8/W8/rig_rest_axes_metadata.json" \
            --out phone-native-localization
      - name: Localize native failures in previously saved exact frames
        run: |
          python scripts/cloud_body_analysis/localize_failures.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization
      - name: Track stable REST-coordinate hotspots across saved shoulder/squat poses
        run: |
          python scripts/cloud_body_analysis/track_rest_hotspots.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization
      - name: Measure squat foot-surface lower-envelope proxy (NOT verified ground contact)
        run: |
          python scripts/cloud_body_analysis/squat_foot_support_proxy.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization
      - name: Audit bilateral grip evidence coverage (NOT grip acceptance)
        run: |
          python scripts/cloud_body_analysis/grip_evidence_coverage.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization
      - name: Publish prospective symmetric grip capture contract (NO native search)
        run: |
          python scripts/cloud_body_analysis/grip_capture_contract.py \
            --contract docs/anatomy/HGPT_GRIP_CAPTURE_CONTRACT_V1.json \
            --out phone-native-localization
      - name: Create phone review sheets from existing Blender screenshots
        run: |
          python scripts/cloud_body_analysis/render_phone_review.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization/visual_reviews
      - name: Publish separate phone-friendly visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-visual-review-${{ github.run_id }}
          path: phone-native-localization/visual_reviews/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve phone-readable, non-editing native failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-native-failure-localization-${{ github.run_id }}
          path: phone-native-localization/
          retention-days: 90
          if-no-files-found: error
