name: ChatGPT validate export-aware corrective tuning
on:
  push:
    branches: [chatgpt/absolute-retarget-imports]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged corrective tuning
        run: python .github/chatgpt_corrective_tuning.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated corrective tuning and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/character/types.ts src/character/index.ts src/character/importedDeformation.ts src/character/importedDeformation.test.ts src/character/retargetSource.ts src/editor/panels/CorrectivePanel.tsx docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_corrective_tuning.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add export-aware elbow corrective tuning"
          git push
