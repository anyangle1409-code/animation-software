name: ORIGINAL v1 production control

on:
  push:
    branches:
      - claude/original-v1-blender-o2-20260929
    paths:
      - '.gitattributes'
      - 'ORIGINAL_V1*.json'
      - 'ORIGINAL_V1_WORK/**'
      - 'scripts/*original*v1*.py'
      - 'scripts/snapshot_original_v1_model_blender.py'
      - 'docs/ORIGINAL_V1*.md'
      - 'docs/work_packages/**'
      - 'RUN_ORIGINAL_V1*.bat'
      - 'PREFLIGHT_CLAUDE_ORIGINAL_V1.bat'
      - 'DOCUMENTATION_MANIFEST.json'
      - '.github/workflows/original-v1-production-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-v1-production-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run production-control safety tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_original_v1_production_control.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_session_preflight.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_change_audit.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_promotion_gate.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_review_manifest.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_evidence_merge.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_interrupted_run.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_evidence_bytes.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_milestone_review.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_phase_exit.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_replay.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_diagnostic_brief.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_repair_preparation.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_surface_audit.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_export_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_garment_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_dressed_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_dressed_range_evidence.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_contact_source_bridge.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_runtime_discovery.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_visual_qa.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_final_freeze.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_execution_orchestration.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_phase5_anatomy.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_phase6_surface_quality.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_phase7_garment_scene.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_phase8_presentation.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_mask_raster.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_session_close.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_progress_summary.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_candidate_closure.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_review_package.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_blend_inventory.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_claude_brief.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_candidate_handoff.py'
          python3 -m unittest discover -s scripts -p 'test_original_v1_local_backup.py'
      - name: Verify exact generated state and unchanged baseline
        run: |
          python3 scripts/build_original_v1_daily_status.py --check
          python3 scripts/verify_original_v1_deformation_baseline.py
          python3 scripts/verify_original_v1_candidate_status.py
          python3 scripts/audit_original_v1_candidate_glbs.py
      - name: Syntax-check Blender-facing evidence tools
        run: |
          python3 -m py_compile scripts/snapshot_original_v1_model_blender.py scripts/pose_test_original_v1_o4_candidate_blender.py scripts/probe_original_v1_grip_penetration_blender.py scripts/original_v1_milestone_review.py
          python3 -m py_compile scripts/export_original_v1_candidate_glb_blender.py scripts/original_v1_export_evidence.py scripts/original_v1_garment_evidence.py scripts/original_v1_dressed_evidence.py scripts/capture_original_v1_dressed_evidence_blender.py scripts/original_v1_dressed_range_evidence.py scripts/capture_original_v1_dressed_range_blender.py scripts/original_v1_contact_source_bridge.py scripts/original_v1_runtime_discovery.py scripts/original_v1_visual_qa.py scripts/verify_original_v1_production_promotion.py scripts/verify_original_v1_final_freeze.py scripts/original_v1_execution_orchestration.py scripts/original_v1_phase5_anatomy.py scripts/capture_original_v1_surface_quality_blender.py scripts/original_v1_phase6_surface_quality.py scripts/original_v1_phase6_capture.py scripts/capture_original_v1_garment_scene_blender.py scripts/original_v1_phase7_garment_scene.py scripts/original_v1_phase7_scene_capture.py scripts/capture_original_v1_presentation_scene_blender.py scripts/original_v1_phase8_presentation.py scripts/original_v1_phase8_scene_capture.py scripts/original_v1_mask_raster.py scripts/capture_original_v1_visual_qa_masks_blender.py scripts/original_v1_session_close.py scripts/original_v1_progress_summary.py scripts/original_v1_candidate_closure.py scripts/original_v1_review_package.py scripts/original_v1_blend_inventory.py scripts/original_v1_claude_brief.py scripts/original_v1_candidate_handoff.py scripts/original_v1_local_backup.py
      - name: Check repository documentation classification
        run: node scripts/check-repository-hygiene.mjs
