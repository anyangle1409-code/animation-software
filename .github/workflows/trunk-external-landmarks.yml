name: Independent trunk anatomy source comparisons

on:
  push:
    branches:
      - codex/trunk-source-landmark-closure-20261009
  pull_request:
    paths:
      - 'scripts/anatomy_fit/external_trunk_landmark_bridge.py'
      - 'scripts/test_external_trunk_landmark_bridge.py'
      - 'scripts/anatomy_fit/pelvic_app_bone_frame.py'
      - 'scripts/test_pelvic_app_bone_frame.py'
      - 'scripts/anatomy_fit/bone_feature_observation_packet.py'
      - 'scripts/test_bone_feature_observation_packet.py'
      - 'ORIGINAL_V1_WORK/anatomy/audit/external_trunk_landmark_source_registry_20261009.json'
      - '.github/workflows/trunk-external-landmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify external CT source guards (never accepts anatomy)
        run: |
          python3 -m unittest discover -s scripts -p 'test_external_trunk_landmark_bridge.py' -v
          python3 -m unittest discover -s scripts -p 'test_pelvic_app_bone_frame.py' -v
          python3 -m unittest discover -s scripts -p 'test_bone_feature_observation_packet.py' -v
          python3 scripts/anatomy_fit/pelvic_app_bone_frame.py \
            --legacy-record ORIGINAL_V1_WORK/anatomy/audit/candidates/shoulder_thorax_c004_arm_inputs/candidate_record.json \
            --source-registry ORIGINAL_V1_WORK/anatomy/audit/external_trunk_landmark_source_registry_20261009.json

          python3 scripts/anatomy_fit/external_trunk_landmark_bridge.py \
            --record ORIGINAL_V1_WORK/anatomy/audit/candidates/shoulder_thorax_c004_arm_inputs/candidate_record.json \
            --source-registry ORIGINAL_V1_WORK/anatomy/audit/external_trunk_landmark_source_registry_20261009.json
          python3 scripts/anatomy_fit/external_trunk_landmark_bridge.py \
            --record ORIGINAL_V1_WORK/anatomy/audit/proposals/p003_spine_disc_repartition_rejected/proposal_record.json \
            --source-registry ORIGINAL_V1_WORK/anatomy/audit/external_trunk_landmark_source_registry_20261009.json
      - name: Preserve prior isolated trunk diagnostics
        run: |
          python3 -m unittest discover -s scripts -p 'test_coupled_trunk_preflight.py' -v
          python3 -m unittest discover -s scripts -p 'test_replay_p004_coupled_thorax.py' -v
          python3 -m unittest discover -s scripts -p 'test_replay_p005_shoulder_chain.py' -v
          python3 -m unittest discover -s scripts -p 'test_rib_3d_coupling_audit.py' -v
          python3 -m unittest discover -s scripts -p 'test_p006_sternocostal_translation_feasibility.py' -v
          python3 -m unittest discover -s scripts -p 'test_p007_sternum_rigid_fit_audit.py' -v
          python3 -m unittest discover -s scripts -p 'test_neutral_arm_thigh_clearance.py' -v
