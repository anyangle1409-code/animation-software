name: ORIGINAL_v1 movement benchmarks
on:
  push:
    branches: [claude/movement-benchmarks-20261013]
  pull_request:
permissions:
  contents: read
jobs:
  native-movement-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: echo '670a37bfd206d702928de721032e2b942725389dc6906df0d866eba8d8cbbe56  ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend' | sha256sum -c -
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb xauth
      - name: Install pinned Blender 5.2.1
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender-5.2.1-linux-x64.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender-5.2.1-linux-x64.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender-5.2.1-linux-x64.tar.xz -C /tmp
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend --threads 2 --python-exit-code 1 --python scripts/blender_tests/test_original_movement_benchmarks.py
      - run: xvfb-run -a /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend --threads 2 --python-exit-code 1 --python scripts/build_original_movement_benchmarks_blender.py -- --out /tmp/m1/report.json --renders /tmp/m1/renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: original-movement-benchmarks
          path: /tmp/m1
