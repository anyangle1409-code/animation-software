name: ChatGPT validate two-hand review gate

on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
    paths:
      - '.github/chatgpt_two_hand_review_gate.py'
      - '.github/workflows/chatgpt-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged two-hand review gate
        run: python .github/chatgpt_two_hand_review_gate.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated review gate and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/review.ts src/editor/review.test.ts docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_two_hand_review_gate.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: gate review on two-hand equipment fit"
          git push
