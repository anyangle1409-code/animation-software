name: Six-Family Prompt + Self-Review Check

on:
  push:
    branches:
      - work/prompt-generation-self-review-six-families-20260925
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused generator and reference tests
        run: >
          npm test --
          src/generation/parse.test.ts
          src/generation/generate.test.ts
          src/reference/evaluate.test.ts
          src/reference/generation.test.ts
          src/reference/reviewManifest.test.ts
          src/reference/reviewCamera.test.ts
          src/reference/worldChecks.test.ts
          src/reference/familyPacks.test.ts
      - name: Build
        run: npm run build
      - name: Full test suite
        run: npm test
