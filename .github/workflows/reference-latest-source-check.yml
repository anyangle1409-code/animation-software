name: Latest Source + Internal Reference Validation

on:
  push:
    branches:
      - work/reference-rebased-latest-20260925
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Reference focused tests
        run: npm test -- src/reference
      - name: Build
        run: npm run build
      - name: Full test suite
        run: npm test
