name: Phone Blender workbench
on:
  push:
    branches: [work/phone-blender-workbench-20261023]
    paths: ['scripts/phone_blender/**', 'scripts/cloud_body_analysis/**', '.github/workflows/phone-blender-workbench.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: phone-blender-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pose-state-w8:
    # First native W8 movement-state trial; an isolated in-memory probe.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 025d5f28fa7eba2064fba565b1c9b60119cdd2cb
          path: _r57
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native Blender 5.2 pose-probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 xvfb
          python -m pip install bpy==5.2.0 numpy scipy
      - name: Verify unchanged reference code revision and pose report tests
        run: |
          test "$(git -C _r57 rev-parse HEAD)" = "025d5f28fa7eba2064fba565b1c9b60119cdd2cb"
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_pose_state_probe.py -v
      - name: Retrieve immutable W8 reconstruction
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12487119841'
          run-id: 39922636070
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/W8
      - name: Measure actual S1-S7 and shoulder-cap motion without model save
        run: |
          python scripts/phone_blender/pose_state_probe.py \
            --source-dir "${{ runner.temp }}/W8" \
            --r57-root "$GITHUB_WORKSPACE/_r57" \
            --out "$GITHUB_WORKSPACE/phone-pose-probe"
      - name: Preserve observed W8 pose-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-w8-shoulder-pose-state-${{ github.run_id }}
          path: phone-pose-probe/
          retention-days: 90
          if-no-files-found: warn

  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: W8
            artifact: '12487119841'
          - model: V14
            artifact: '12487932177'
          - model: R120
            artifact: '12488550235'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cloud Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python -m pip install bpy==5.2.0 numpy scipy
      - name: Retrieve preserved reconstruction
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.artifact }}
          run-id: 39922636070
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/model
      - name: Run isolated read-only task
        env:
          MODEL: ${{ matrix.model }}
          INPUT_DIR: ${{ runner.temp }}/model
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python scripts/phone_blender/task.py
      - name: Preserve phone-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-blender-${{ matrix.model }}-${{ github.run_id }}
          path: phone-results/
          retention-days: 90
          if-no-files-found: error
  compare-rest-audits:
    needs: [inspect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve this run's W8 V14 R120 read-only JSON reports
        uses: actions/download-artifact@v4
        with:
          pattern: phone-blender-*-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-audit-reports
          merge-multiple: true
      - name: Test and aggregate read-only evidence
        run: |
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_compare_reports.py -v
          python -m unittest discover -s scripts/cloud_body_analysis/tests -p test_compare_rig_axes.py -v
          python scripts/cloud_body_analysis/compare_reports.py --root "${{ runner.temp }}/phone-audit-reports" --out phone-comparison
          python scripts/cloud_body_analysis/compare_rig_axes.py --root "${{ runner.temp }}/phone-audit-reports" --out phone-comparison
      - name: Preserve cross-model comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-rest-cross-model-${{ github.run_id }}
          path: phone-comparison/
          retention-days: 90
          if-no-files-found: error
  localize-native-movement-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install report-only dependencies
        run: python -m pip install numpy pillow
      - name: Verify independent failure-localization unit tests
        run: python -m unittest discover -s scripts/cloud_body_analysis/tests -v
      - name: Retrieve pinned W8 read-only visual evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12495910312'
          run-id: 39937882229
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native/W8
          merge-multiple: true
      - name: Retrieve pinned V14 read-only visual evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12494932817'
          run-id: 39937882229
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native/V14
          merge-multiple: true
      - name: Retrieve pinned R120 read-only visual evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12495970648'
          run-id: 39937882229
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native/R120
          merge-multiple: true
      - name: Localize native failures in previously saved exact frames
        run: |
          python scripts/cloud_body_analysis/localize_failures.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization
      - name: Track stable REST-coordinate hotspots across saved shoulder/squat poses
        run: |
          python scripts/cloud_body_analysis/track_rest_hotspots.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization
      - name: Create phone review sheets from existing Blender screenshots
        run: |
          python scripts/cloud_body_analysis/render_phone_review.py \
            --w8 "${{ runner.temp }}/native/W8" \
            --v14 "${{ runner.temp }}/native/V14" \
            --r120 "${{ runner.temp }}/native/R120" \
            --out phone-native-localization/visual_reviews
      - name: Publish separate phone-friendly visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-visual-review-${{ github.run_id }}
          path: phone-native-localization/visual_reviews/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve phone-readable, non-editing native failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-native-failure-localization-${{ github.run_id }}
          path: phone-native-localization/
          retention-days: 90
          if-no-files-found: error
