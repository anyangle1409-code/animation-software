name: G4t exact original full-body decoded source buffer immutability
on:
  push:
    branches: [codex/g4t-fullbody-source-buffer-immutability-20261012]
    paths:
      - src/viewer/firstPartyOriginalFullBodyImmutableSource.mjs
      - src/viewer/firstPartyOriginalFullBodyReview.mjs
      - src/viewer/firstPartyOriginalFullBodyGpuRest.mjs
      - tests/firstPartyOriginalFullBodySourceImmutability.test.mjs
      - .github/workflows/first_party_original_fullbody_post_sha_guard.yml
  pull_request:
    paths:
      - src/viewer/firstPartyOriginalFullBodyImmutableSource.mjs
      - src/viewer/firstPartyOriginalFullBodyReview.mjs
      - src/viewer/firstPartyOriginalFullBodyGpuRest.mjs
      - tests/firstPartyOriginalFullBodySourceImmutability.test.mjs
      - .github/workflows/first_party_original_fullbody_post_sha_guard.yml
permissions:
  contents: read
jobs:
  reject-all-post-authentication-mesh-skin-and-morph-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: |
          node --test tests/firstPartyOriginalFullBodySourceImmutability.test.mjs
          node --test tests/firstPartyOriginalFullBodyGpuRest.test.mjs
          node --test tests/firstPartyOriginalFullBodyReviewSourceGuard.test.mjs
          node --test tests/firstPartyPrototypeModelHandoff.test.mjs
          node --test tests/firstPartyOriginalGltfRestWorld.test.mjs
  unchanged-existing-studio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
