name: ChatGPT validate grip profiles

on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
    paths:
      - '.github/chatgpt_grip_profiles.py'
      - '.github/workflows/chatgpt-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged grip profiles
        run: python .github/chatgpt_grip_profiles.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated grip profiles and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/exercises/gripProfiles.ts src/exercises/gripProfiles.test.ts src/exercises/types.ts src/animation/generate.ts src/editor/store.ts src/editor/store.test.ts src/editor/panels/GripPanel.tsx docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_grip_profiles.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add equipment-aware grip profiles"
          git push
