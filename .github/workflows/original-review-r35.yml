name: ORIGINAL_v1 R35 arm-to-side rebuild
on:
  push:
    branches: [claude/original-v1-consolidated-review-20261014]
    paths:
      - '.github/workflows/original-review-r35.yml'
      - 'scripts/tests/test_original_review_r35_contour.py'
      - 'scripts/fair_original_review_r35_targets.py'
      - 'scripts/probe_original_review_r35_blender.py'
      - 'scripts/original_review_contour.py'
      - 'scripts/build_original_review_candidate_r35_blender.py'
      - 'scripts/render_original_review_r35_blender.py'
      - 'scripts/package_original_review_r35.py'
      - 'scripts/original_review_candidate_checks.py'
      - 'scripts/tests/test_original_review_candidate_reporting.py'
concurrency:
  group: original-v1-r35-candidate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-review-r35:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb ffmpeg python3-pil python3-scipy fonts-dejavu-core
      - name: Install pinned Blender 5.2.1
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Export parent geometry in a clean Blender process
        run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/build_original_review_candidate_r35_blender.py -- export
      - name: Confirm fixed contour goals fail on unchanged R34
        run: |
          set +e
          HGPT_CONTOUR_NPZ=/tmp/r35-source.npz /usr/bin/python3 scripts/tests/test_original_review_r35_contour.py > /tmp/r34-contour-red.txt 2>&1
          result=$?
          set -e
          cat /tmp/r34-contour-red.txt
          test "$result" -eq 1
          grep -F 'FAILED (failures=2)' /tmp/r34-contour-red.txt
      - name: Verify reporting failure cases
        run: /usr/bin/python3 -m unittest discover -s scripts/tests -p test_original_review_candidate_reporting.py
      - name: Create broader fair skin targets outside Blender
        run: /usr/bin/python3 scripts/fair_original_review_r35_targets.py /tmp/r35-source.npz /tmp/r35-target-deltas.npz
      - name: Build separate R35 with original guards
        if: hashFiles('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/HGPT_ORIGINAL_V1_REVIEW_R35_CODEX.blend') == ''
        run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/build_original_review_candidate_r35_blender.py -- build
      - name: Run fixed front goals on R35 and retain failures
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export HGPT_FRONT_TEST_BLEND=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/HGPT_ORIGINAL_V1_REVIEW_R35_CODEX.blend
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016
          /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/blender_tests/test_original_review_candidate_r34_front.py 2>&1 | tee "$out/front_test.txt"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$out/front_test_exit.txt"
          exit 0
      - name: Verify saved model against its build hash
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          d = Path('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016')
          expected = json.loads((d / 'r35_build.json').read_text())['sha256']
          actual = hashlib.sha256((d / 'HGPT_ORIGINAL_V1_REVIEW_R35_CODEX.blend').read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          PY
      - name: Check preservation and measure both paths in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          blender=/tmp/blender-5.2.1-linux-x64/blender
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016
          r34=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r34_20261016/HGPT_ORIGINAL_V1_REVIEW_R34_CODEX.blend
          r35="$out/HGPT_ORIGINAL_V1_REVIEW_R35_CODEX.blend"
          "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- identity "$r35" "$out/identity.json"
          for version in r34 r35; do
            model="$r34"
            if [ "$version" = r35 ]; then model="$r35"; fi
            if [ ! -f "$out/${version}_press.json" ]; then
              "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- press "$model" "$out/${version}_press.json"
            fi
            if [ ! -f "$out/${version}_benchmarks.json" ]; then
              "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- benchmarks "$model" "$out/${version}_benchmarks.json"
            fi
          done
      - name: Recheck both original guard baselines on the final saved model
        run: |
          /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py -- guard ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/HGPT_ORIGINAL_V1_REVIEW_R35_CODEX.blend ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/r35_guard_recheck.json
      - name: Render matching press views in fresh processes
        if: hashFiles('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/r34_r35_same_angle_comparison.jpg') == '' || hashFiles('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/shoulder_press_r35_three_views.mp4') == ''
        shell: bash
        run: |
          set -euo pipefail
          blender=/tmp/blender-5.2.1-linux-x64/blender
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016
          r34=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r34_20261016/HGPT_ORIGINAL_V1_REVIEW_R34_CODEX.blend
          r35="$out/HGPT_ORIGINAL_V1_REVIEW_R35_CODEX.blend"
          for version in r34 r35; do
            model="$r34"
            if [ "$version" = r35 ]; then model="$r35"; fi
            xvfb-run -a "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/render_original_review_r35_blender.py -- "$model" "/tmp/r35-frames/$version"
          done
      - name: Measure final saved-model contour and retain all test failures
        shell: bash
        run: |
          set -euo pipefail
          out=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016
          /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/probe_original_review_r35_blender.py -- "$out/HGPT_ORIGINAL_V1_REVIEW_R35_CODEX.blend" "$out/probe"
          set +e
          HGPT_CONTOUR_NPZ="$out/probe/r35_contour_surfaces.npz" /usr/bin/python3 scripts/tests/test_original_review_r35_contour.py > "$out/contour_test.txt" 2>&1
          result=$?
          printf '%s\n' "$result" > "$out/contour_test_exit.txt"
          cat "$out/contour_test.txt"
      - name: Render exact junction closeups for both versions
        shell: bash
        run: |
          set -euo pipefail
          blender=/tmp/blender-5.2.1-linux-x64/blender
          for version in r34 r35; do
            model="ORIGINAL_V1_WORK/anatomy/candidates/codex_review_${version}_20261016/HGPT_ORIGINAL_V1_REVIEW_${version^^}_CODEX.blend"
            xvfb-run -a "$blender" --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/render_original_review_r35_blender.py -- "$model" "/tmp/r35-junction/$version" junction_closeups
          done
      - name: Package every regression, comparison and video
        run: /usr/bin/python3 scripts/package_original_review_r35.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v1-r35-review-evidence
          path: |
            /tmp/r34-contour-red.txt
            /tmp/r35-junction/
            ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/
            docs/CODEX_ORIGINAL_V1_REVIEW_CANDIDATE_R35_20261016.md
      - name: Preserve candidate and evidence on the requested branch
        shell: bash
        run: |
          set -euo pipefail
          branch=claude/original-v1-consolidated-review-20261014
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016 docs/CODEX_ORIGINAL_V1_REVIEW_CANDIDATE_R35_20261016.md
          git commit -m 'Preserve R35 review experiment with tests, metrics, comparisons and video'
          git push origin "HEAD:$branch"
      - name: Require numerical success without hiding rejected experiments
        run: |
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r35_20261016/r35_review.json')
          report = json.loads(p.read_text())
          assert report['status'] == 'NUMERIC_CHECKS_PASSED_AWAITING_VISUAL_REVIEW', report['status']
          PY

