name: ORIGINAL_v1 foot C4 provisional candidate (Claude)
on:
  push:
    branches: [claude/original-v1-foot-shape-20261013]
  pull_request:
    paths: ['scripts/*original_foot*', 'scripts/blender_tests/test_original_foot_c4_candidate.py', 'ORIGINAL_V1_WORK/anatomy/candidates/claude_foot_20261013/**', '.github/workflows/original-foot-c4.yml']
permissions:
  contents: read
jobs:
  native-foot-c4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Install pinned Blender 5.2.1
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender-5.2.1-linux-x64.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender-5.2.1-linux-x64.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender-5.2.1-linux-x64.tar.xz -C /tmp
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_foot_c4_candidate.py
        env:
          BLENDER_BIN: /tmp/blender-5.2.1-linux-x64/blender
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_tests/test_original_foot_c5_heel_contact.py
        env:
          BLENDER_BIN: /tmp/blender-5.2.1-linux-x64/blender
