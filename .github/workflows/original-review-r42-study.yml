name: ORIGINAL_v1 R42 unsaved contour feasibility study
'on':
  push:
    branches:
    - claude/original-v1-consolidated-review-20261014
    paths:
    - .github/workflows/original-review-r42-study.yml
    - scripts/data/r42_study_delta_20261017.npz
permissions:
  contents: read
  actions: read
jobs:
  native-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
        xvfb ffmpeg python3-pil python3-scipy fonts-dejavu-core
    - name: Install pinned Blender 5.2.1
      run: 'curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
        --output /tmp/blender.tar.xz

        echo ''a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz''
        | sha256sum -c -

        tar -xJf /tmp/blender.tar.xz -C /tmp

        '
    - name: Verify immutable parent model hash
      run: '/usr/bin/python3 - <<''PYHASH''

        import hashlib,json

        from pathlib import Path

        p=Path(''ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r41_20261017'')

        assert hashlib.sha256((p/''HGPT_ORIGINAL_V1_REVIEW_R41_CODEX.blend'').read_bytes()).hexdigest()==json.loads((p/''r41_build.json'').read_text())[''sha256'']

        PYHASH

        '
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r42-native-response
        run-id: 39048442821
        github-token: ${{ github.token }}
        path: /tmp/r42-response
    - name: Recreate fixed trial domain and verify preservation
      run: '/usr/bin/python3 scripts/prepare_original_review_r42.py /tmp/r42-response/response.npz
        /tmp/r42-response/prepared.npz --absolute-cap

        HGPT_R42_RESPONSE=/tmp/r42-response/prepared.npz HGPT_R42_SOLUTION=scripts/data/r42_study_delta_20261017.npz
        /usr/bin/python3 scripts/tests/test_original_review_r42_preservation.py

        /usr/bin/python3 scripts/tests/test_original_review_r42_cap.py

        /usr/bin/python3 scripts/tests/test_original_review_r42_bounded_optimizer.py

        '
    - name: Native unsaved study; render previous and attempted junction
      run: xvfb-run -a /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup
        --threads 2 --python-exit-code 1 --python scripts/render_original_review_r42_study_blender.py
        -- /tmp/r42-response/prepared.npz scripts/data/r42_study_delta_20261017.npz
        /tmp/r42-study
    - name: Measure all83 actual native area and contact responses
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads
        2 --python-exit-code 1 --python scripts/detect_original_review_r42_contacts_blender.py
        -- /tmp/r42-response/prepared.npz scripts/data/r42_study_delta_20261017.npz
        /tmp/r42-study/native_contacts.json
    - name: Retain all fixed contour and front test results
      shell: bash
      run: "set +e\nexport HGPT_CONTOUR_NPZ=/tmp/r42-study/R42_study/native_probe.npz\n\
        export HGPT_LINE_PARENT_NPZ=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/probe/r35_contour_surfaces.npz\n\
        for name in r42_profile r37_contour r38_marks r41_line r41_front; do\n  /usr/bin/python3\
        \ \"scripts/tests/test_original_review_${name}.py\" >\"/tmp/r42-study/${name}_test.txt\"\
        \ 2>&1\n  printf '%s\\n' \"$?\" >\"/tmp/r42-study/${name}_test_exit.txt\"\n\
        \  cat \"/tmp/r42-study/${name}_test.txt\"\ndone\nexit 0\n"
    - name: Package visibly labelled comparison and press video
      run: /usr/bin/python3 scripts/package_original_review_r42_study.py /tmp/r42-study
        /tmp/r42-study/review
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: original-v1-r42-unsaved-contour-study
        path: '/tmp/r42-study/

          /tmp/r42-response/prepared.npz.json

          '
