name: ChatGPT validate socket authoring

on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
    paths:
      - '.github/chatgpt_socket_workspace.py'
      - '.github/workflows/chatgpt-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged socket authoring
        run: python .github/chatgpt_socket_workspace.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated socket authoring and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/equipment/types.ts src/equipment/library.ts src/equipment/attach.ts src/viewer/EquipmentView.tsx src/editor/store.ts src/editor/store.test.ts src/editor/panels/EquipmentPanel.tsx src/viewer/Viewport.tsx src/editor/styles.css docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_socket_workspace.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add per-instance equipment socket authoring"
          git push
