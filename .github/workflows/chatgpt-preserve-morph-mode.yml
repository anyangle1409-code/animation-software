name: ChatGPT Preserve Imported Morph Mode
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/chatgpt_preserve_morph_mode.py
      - run: |
          git config user.name ChatGPT
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- src/character/importedDeformation.ts; then exit 0; fi
          git add src/character/importedDeformation.ts
          git commit -m 'fix: preserve imported morph target convention'
          git push
