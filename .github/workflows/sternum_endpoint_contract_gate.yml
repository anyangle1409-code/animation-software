name: Sternum endpoint semantics and three-distance geometry gate
on:
  push:
    branches: [codex/sternum-endpoint-contract-gate-20261010]
    paths:
      - 'ORIGINAL_V1_WORK/anatomy/sternum_endpoint_compatibility_contract_20261010.json'
      - 'scripts/anatomy_fit/sternum_endpoint_compatibility_gate.py'
      - 'scripts/test_sternum_endpoint_compatibility_gate_20261010.py'
      - '.github/workflows/sternum_endpoint_contract_gate.yml'
      - 'docs/STERNUM_ENDPOINT_COMPATIBILITY_AND_NONUNIQUE_3D_20261010.md'
  pull_request:
    paths:
      - 'ORIGINAL_V1_WORK/anatomy/sternum_endpoint_compatibility_contract_20261010.json'
      - 'scripts/anatomy_fit/sternum_endpoint_compatibility_gate.py'
      - 'scripts/test_sternum_endpoint_compatibility_gate_20261010.py'
      - '.github/workflows/sternum_endpoint_contract_gate.yml'
      - 'docs/STERNUM_ENDPOINT_COMPATIBILITY_AND_NONUNIQUE_3D_20261010.md'

jobs:
  reject-noncomparable-sternum-measurements:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: All inherited primary-source tests plus new 21 nonpromotion tests
        run: |
          python -m unittest discover -s scripts -p 'test_sternum_selthofer_primary_recheck_20261010.py' -v
          python -m unittest discover -s scripts -p 'test_thai_sternocostal_intervals_20261010.py' -v
          python -m unittest discover -s scripts -p 'test_sternum_endpoint_compatibility_gate_20261010.py' -v
      - name: Fail-closed full comparative contract with numeric 3D nonuniqueness witness
        run: |
          python scripts/anatomy_fit/sternum_endpoint_compatibility_gate.py > "$RUNNER_TEMP/endpoint-source-gate.json"
          python - "$RUNNER_TEMP/endpoint-source-gate.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: r=json.load(f)
          assert r['source_measurement_rows']==12
          assert len(r['forbidden_cross_source_comparisons'])==5
          assert r['all_automatic_sternum_targets_rejected'] is True
          assert r['no_canonical_geometry_changed'] is True
          assert r['no_CP1_gate_promotion'] is True
          witness=r['nonunique_three_notch_3d_counterexample']
          assert witness['identical_three_local_facet_intervals_mm']==[29.3,25.2,19.56]
          assert witness['nonunique_3d_geometry_from_three_distances'] is True
          print('Twelve guarded source measurements, five prohibited comparisons and 3D nonuniqueness PASS')
          PY
      - name: Explicitly refuse dangerous endpoint pair in CLI
        run: |
          python scripts/anatomy_fit/sternum_endpoint_compatibility_gate.py --compare SELTHOFER2006_WHOLE TURKEY2018_CL > "$RUNNER_TEMP/endpoint-rejected-pair.json"
          python - "$RUNNER_TEMP/endpoint-rejected-pair.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: d=json.load(f)
          assert d['status']=='REJECT_FOR_CANONICAL_TARGET'
          assert d['reason']=='DISTAL_XIPHOID_INCLUDED_VS_EXCLUDED'
          assert d['automatic_sternum_mesh_retarget_allowed'] is False
          PY
      - name: Upload nonmedical numerical QA only
        uses: actions/upload-artifact@v4
        with:
          name: sternum-source-endpoint-rejection-contract
          path: |
            ${{ runner.temp }}/endpoint-source-gate.json
            ${{ runner.temp }}/endpoint-rejected-pair.json
          if-no-files-found: error
          retention-days: 14
