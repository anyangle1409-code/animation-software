name: ChatGPT validate whole-rep grip worst-point review

on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
    paths:
      - '.github/chatgpt_whole_rep_grip_review.py'
      - '.github/workflows/chatgpt-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged whole-rep grip review
        run: python .github/chatgpt_whole_rep_grip_review.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated whole-rep grip review and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/gripReview.ts src/editor/gripReview.test.ts src/editor/panels/GripPanel.tsx docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_whole_rep_grip_review.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add whole-rep grip worst-point review"
          git push
