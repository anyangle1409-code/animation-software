name: Provisional absolute reach
on:
  push:
    branches: [codex/functional-absolute-reach-20261011]
    paths: ['scripts/build_functional_absolute_reach_blender.py', 'scripts/build_functional_thorax_context_blender.py', 'scripts/blender_tests/test_functional_absolute_reach.py', '.github/workflows/functional-absolute-reach.yml']
  pull_request:
    paths: ['scripts/build_functional_absolute_reach_blender.py', 'scripts/build_functional_thorax_context_blender.py', 'scripts/blender_tests/test_functional_absolute_reach.py', '.github/workflows/functional-absolute-reach.yml']
permissions:
  contents: read
jobs:
  native-reach:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender libegl1 libgl1-mesa-dri xvfb xauth
      - run: blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/blender_tests/test_functional_absolute_reach.py
      - run: xvfb-run -a blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/build_functional_absolute_reach_blender.py -- --out /tmp/hgpt-absolute-reach
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: provisional-absolute-reach-views-and-native-matrices
          path: |
            /tmp/hgpt-absolute-reach/*.png
            /tmp/hgpt-absolute-reach/*.json
