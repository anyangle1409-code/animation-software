name: Work cloud software integration
on:
  push:
    branches: [work/cloud-integration-export-20261014]
  pull_request:
    paths:
      - scripts/original_v1_export_evidence.py
      - scripts/test_original_v1_export_evidence.py
      - scripts/test_original_glb_display_provenance_blender.py
      - .github/workflows/work-cloud-integration.yml
permissions:
  contents: read
jobs:
  source-components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: PYTHONPATH=scripts python3 -m unittest scripts.test_original_v1_export_evidence -v
      - name: Install pinned native Blender
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Actual source component provenance
        run: |
          echo '670a37bfd206d702928de721032e2b942725389dc6906df0d866eba8d8cbbe56  ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend' | sha256sum -c -
          /tmp/blender-5.2.1-linux-x64/blender -b ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend --python-exit-code 1 --python scripts/test_original_glb_display_provenance_blender.py
