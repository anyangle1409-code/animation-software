name: ORIGINAL_v1 R52 independent temporal surface study
'on':
  push:
    branches:
    - claude/original-v1-consolidated-review-20261014
    paths:
    - .github/workflows/original-review-r52.yml
permissions:
  contents: write
  actions: read
jobs:
  native-temporal-study:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@v4
    - name: Refuse to overwrite R52 study
      run: test ! -e ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r52_study_20261019
    - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri xvfb ffmpeg python3-pil python3-scipy fonts-dejavu-core
        python3-venv python3-pip
    - name: Pin the locally verified fitting runtime
      run: '/usr/bin/python3 -m venv --system-site-packages /tmp/r52-python

        /tmp/r52-python/bin/python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0

        /tmp/r52-python/bin/python -c "import numpy,scipy; assert numpy.__version__==''2.3.5'' and scipy.__version__==''1.17.0'';
        print(''FITTING_RUNTIME'',numpy.__version__,scipy.__version__)"

        '
    - name: Install pinned Blender 5.2.1
      run: 'curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
        --output /tmp/blender.tar.xz

        echo ''a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz'' | sha256sum -c -

        tar -xJf /tmp/blender.tar.xz -C /tmp

        '
    - name: Verify immutable parent model hash
      run: '/tmp/r52-python/bin/python - <<''PYHASH''

        import hashlib,json

        from pathlib import Path

        p=Path(''ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r41_20261017'')

        assert hashlib.sha256((p/''HGPT_ORIGINAL_V1_REVIEW_R41_CODEX.blend'').read_bytes()).hexdigest()==json.loads((p/''r41_build.json'').read_text())[''sha256'']

        PYHASH

        '
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r47-shape-study
        run-id: 39153244090
        github-token: ${{ github.token }}
        path: /tmp/r47-previous
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r51-review
        run-id: 39172099330
        github-token: ${{ github.token }}
        path: /tmp/r51-previous
    - name: Verify original response and R51 checkpoint; repeat focused tests
      run: 'mkdir -p /tmp/r52-response

        cp /tmp/r51-previous/tmp/r51-response/source.npz /tmp/r52-response/source.npz

        cp /tmp/r51-previous/tmp/r51-response/solved.npz /tmp/r52-response/initial.npz

        /tmp/r52-python/bin/python - <<''PYHASH''

        from pathlib import Path

        import hashlib

        p=Path(''/tmp/r52-response'')

        assert hashlib.sha256((p/''source.npz'').read_bytes()).hexdigest()==''2a6c01cf7eacd3d1ceb47ae9f131f76dd0487fce5d3518d5cd1df65bc059fa8d''

        assert hashlib.sha256((p/''initial.npz'').read_bytes()).hexdigest()==''45b17ecc0f9261c3af9c08c44f7cdff0c054076015a3f0cd62d92c7d5bc83fc1''

        PYHASH

        /tmp/r52-python/bin/python scripts/run_original_review_r52_checks.py /tmp/r52-response unit

        '
    - name: Bounded preflight and main temporal study; no model save
      shell: bash
      run: 'set +e

        timeout 180s env HGPT_R52_ITERATIONS=100 HGPT_R52_SECONDS=120 /tmp/r52-python/bin/python -u scripts/solve_original_review_r52.py
        /tmp/r52-response/source.npz /tmp/r52-response/initial.npz /tmp/r52-response/preflight.npz > /tmp/r52-response/preflight.log
        2>&1

        preflight_code=$?

        printf ''%s\n'' "$preflight_code" > /tmp/r52-response/preflight_exit.txt

        set -e

        tail -10 /tmp/r52-response/preflight.log

        test "$preflight_code" -eq 0

        set +e

        timeout 12m env HGPT_R52_ITERATIONS=1800 HGPT_R52_SECONDS=600 /tmp/r52-python/bin/python -u scripts/solve_original_review_r52.py
        /tmp/r52-response/source.npz /tmp/r52-response/initial.npz /tmp/r52-response/solved.npz > /tmp/r52-response/fit.log
        2>&1

        fit_code=$?

        printf ''%s\n'' "$fit_code" > /tmp/r52-response/fit_exit.txt

        set -e

        /tmp/r52-python/bin/python scripts/retain_original_review_r52.py /tmp/r52-response "$fit_code"

        tail -12 /tmp/r52-response/fit.log

        /tmp/r52-python/bin/python scripts/run_original_review_r52_checks.py /tmp/r52-response projection

        '
    - name: All83 actual native surface/contact/orientation/affine checks
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/detect_original_review_r52_contacts_blender.py
        -- /tmp/r52-response/source.npz /tmp/r52-response/solved.npz /tmp/r52-response/native_final.json
    - name: All13 unchanged native movement benchmarks
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/validate_original_review_r52_benchmarks_blender.py
        -- /tmp/r52-response/source.npz /tmp/r52-response/solved.npz /tmp/r52-response/benchmarks.json
    - name: Additional161 native temporal poses against immutable R41
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r52_dense_motion_blender.py
        -- /tmp/r52-response/source.npz /tmp/r52-response/solved.npz /tmp/r52-response/dense_motion.json
    - name: Render actual R52 rear and three-quarter evidence; verify protected identities
      run: xvfb-run -a /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads 2 --python-exit-code
        1 --python scripts/render_original_review_r52_blender.py -- /tmp/r52-response/source.npz /tmp/r52-response/solved.npz
        /tmp/r52-study
    - name: Retain actual dense and all historical test outcomes unchanged
      run: /tmp/r52-python/bin/python scripts/run_original_review_r52_checks.py /tmp/r52-response native
    - name: Package actual R51/R52 images and videos; R47 outline reference; no save
      run: /tmp/r52-python/bin/python scripts/package_original_review_r52.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: original-v1-r52-review
        path: '/tmp/r52-response/

          /tmp/r52-study/

          ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r52_study_20261019/'
        retention-days: 14
    - name: Commit new R52 evidence normally to approved branch
      run: 'git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r52_study_20261019/ docs/CODEX_ORIGINAL_V1_REVIEW_CANDIDATE_R52_20261019.md

        git commit -m ''R52 actual temporal surface study; retain all failures; no saved model''

        git push origin HEAD:claude/original-v1-consolidated-review-20261014

        '
    - name: Require honest unsaved status and protected identity
      run: '/tmp/r52-python/bin/python - <<''PYREQUIRE''

        from pathlib import Path

        import json

        p=Path(''ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r52_study_20261019'')

        z=json.loads((p/''r52_review.json'').read_text())

        assert not z[''model_saved''] and not z[''approved''] and not z[''shape_repair_complete'']

        assert all(z[''protected_identity''].values())

        assert not list(p.glob(''*.blend''))

        PYREQUIRE

        '
concurrency:
  group: original-v1-r52-temporal-study
  cancel-in-progress: false
