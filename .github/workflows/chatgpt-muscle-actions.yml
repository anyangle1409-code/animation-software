name: ChatGPT latissimus functional path sweep
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create lat via-point sweep
        run: |
          cat > src/muscles/__lat_via_sweep.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { poseFromDegrees } from '../rig/pose';
          import { canonicalSkeleton, PoseEvaluation } from '../rig/skeleton';
          import { createMuscleTransform, muscleInstance, resolveMuscle } from './model';
          import type { MuscleDefinition } from './model';
          import { vec3 } from '../rig/types';

          const skeleton = canonicalSkeleton;
          const evaluation = new PoseEvaluation(skeleton);
          const transform = createMuscleTransform();
          const at = (bone: any, x: number, y: number, z: number) => ({ bone, offset: vec3(x, y, z) });

          function stretch(def: MuscleDefinition, rotations: Parameters<typeof poseFromDegrees>[0]) {
            const instance = muscleInstance(def, 'l');
            evaluation.apply(poseFromDegrees(rotations));
            resolveMuscle(evaluation, instance, transform);
            return transform.stretch;
          }

          describe('latissimus functional route', () => {
            it('finds a humeral via point while preserving the proven visible endpoints', () => {
              const results: any[] = [];
              for (const vx of [-0.06,-0.04,-0.02,0,0.02,0.04,0.06,0.08]) {
                for (const vy of [0.005,0.02,0.04,0.06,0.08,0.11,0.14]) {
                  for (const vz of [-0.08,-0.06,-0.04,-0.02,0,0.02,0.04,0.06,0.08]) {
                    const def: MuscleDefinition = {
                      group: 'latissimus',
                      origin: at('spine_01', -0.055, 0.02, -0.06),
                      via: [at('upperarm_l', vx, vy, vz)],
                      insertion: at('upperarm_l', 0.014, 0.028, -0.014),
                      thickness: 0.032,
                      bulge: 0.25,
                      flatten: 0.55,
                      spread: 1.5,
                    };
                    const extension = stretch(def, { upperarm_l: { x: -30 } });
                    const adduction = stretch(def, { upperarm_l: { z: 30 } });
                    const restLength = muscleInstance(def, 'l').restLength;
                    const penalty = Math.max(0, extension - 0.995) * 20 + Math.max(0, adduction - 0.995) * 20;
                    const score = penalty + Math.abs(extension - 0.95) + Math.abs(adduction - 0.95) + Math.abs(restLength - 0.45) * 0.05;
                    results.push({ vx, vy, vz, extension, adduction, restLength, score });
                  }
                }
              }
              results.sort((a,b) => a.score-b.score);
              console.log('LAT_VIA_BEST=' + JSON.stringify(results.slice(0,40)));
              const valid = results.filter((r) => r.extension < 0.98 && r.adduction < 0.98);
              console.log('LAT_VIA_VALID=' + JSON.stringify(valid.slice(0,20)));
              expect(valid.length).toBeGreaterThan(0);
            });
          });
          EOF
      - run: npx vitest run src/muscles/__lat_via_sweep.test.ts --reporter=verbose
