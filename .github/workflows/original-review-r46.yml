name: ORIGINAL_v1 R46 skin-surface distance fit and native review
'on':
  push:
    branches:
    - claude/original-v1-consolidated-review-20261014
    paths:
    - .github/workflows/original-review-r46.yml
permissions:
  contents: write
  actions: read
jobs:
  native-study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      HGPT_R43_MATERIAL_FIELD: '1'
      HGPT_R43_LP_METHOD: highs-ipm
    steps:
    - uses: actions/checkout@v4
    - name: Refuse to overwrite an existing R46 candidate or study
      run: 'test ! -e ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018

        test ! -e ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_study_20261018'
    - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
        xvfb ffmpeg python3-pil python3-scipy fonts-dejavu-core
    - name: Install pinned Blender 5.2.1
      run: 'curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
        --output /tmp/blender.tar.xz

        echo ''a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz''
        | sha256sum -c -

        tar -xJf /tmp/blender.tar.xz -C /tmp

        '
    - name: Verify immutable parent model hash
      run: '/usr/bin/python3 - <<''PYHASH''

        import hashlib,json

        from pathlib import Path

        p=Path(''ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r41_20261017'')

        assert hashlib.sha256((p/''HGPT_ORIGINAL_V1_REVIEW_R41_CODEX.blend'').read_bytes()).hexdigest()==json.loads((p/''r41_build.json'').read_text())[''sha256'']

        PYHASH

        '
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r45-review
        run-id: 39115485844
        github-token: ${{ github.token }}
        path: /tmp/r45-previous
    - uses: actions/download-artifact@v4
      with:
        name: original-v1-r42-unsaved-contour-study
        run-id: 39073116321
        github-token: ${{ github.token }}
        path: /tmp/r42-previous
    - name: Prepare unchanged material domain; verify skin-surface metric
      run: 'mkdir -p /tmp/r46-response

        /usr/bin/python3 - <<''PYPREP''

        from pathlib import Path

        import shutil,hashlib,numpy as np

        source=Path(''/tmp/r45-previous/tmp/r45-response/source.npz'');shutil.copy2(source,''/tmp/r46-response/source.npz'');z=np.load(source)

        initial=Path(''/tmp/r45-previous/tmp/r45-response/solved.npz'');assert hashlib.sha256(initial.read_bytes()).hexdigest()==''fa9720bc900e6e646a197d578381eaaac7ed95561e2f9330cdae76226c1b09c1'';shutil.copy2(initial,''/tmp/r46-response/initial.npz'')

        raw=Path(''/tmp/r45-previous/tmp/r45-study/R45'');assert raw.exists();shutil.copytree(raw,Path(''/tmp/r42-previous/r42-study/R45''))

        shutil.copy2(next(Path(''/tmp/r45-previous'').rglob(''r42_contacts.json'')),''/tmp/r46-response/r42_contacts.json'')

        PYPREP

        export HGPT_R46_RESPONSE=/tmp/r46-response/source.npz

        for name in material_distance domain; do /usr/bin/python3 "scripts/tests/test_original_review_r46_${name}.py";
        done

        /usr/bin/python3 scripts/tests/test_original_review_r44_area_bounds.py

        /usr/bin/python3 scripts/tests/test_original_review_r46_lp.py

        for name in gradients sampling lp; do /usr/bin/python3 "scripts/tests/test_original_review_r43_${name}.py";
        done

        '
    - name: Fit with skin-surface distances and all unchanged gates
      shell: bash
      run: "set +e\nset -o pipefail\ntimeout 9000 /usr/bin/python3 -u scripts/solve_original_review_r46.py\
        \ /tmp/r46-response/source.npz /tmp/r46-response/initial.npz ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/probe/r35_contour_surfaces.npz\
        \ /tmp/r46-response/r42_contacts.json /tmp/r46-response/solved.npz 2>&1 |\
        \ tee /tmp/r46-response/fit.log\nresult=${PIPESTATUS[0]}\nprintf '%s\\n' \"\
        $result\" > /tmp/r46-response/solver_exit.txt\nif [ ! -f /tmp/r46-response/solved.npz\
        \ ]; then\n if [ -f /tmp/r46-response/solved.npz.progress.npz ]; then cp /tmp/r46-response/solved.npz.progress.npz\
        \ /tmp/r46-response/solved.npz; else cp /tmp/r46-response/initial.npz /tmp/r46-response/solved.npz;\
        \ fi\nfi\ntail -50 /tmp/r46-response/fit.log\nexit 0\n"
    - name: Preserve source-scope and unchanged motion/surface test results
      shell: bash
      run: "set +e\nexport HGPT_R46_RESPONSE=/tmp/r46-response/source.npz HGPT_R46_SOLUTION=/tmp/r46-response/solved.npz\n\
        export HGPT_R43_RESPONSE=/tmp/r46-response/source.npz HGPT_R43_SOLUTION=/tmp/r46-response/solved.npz\n\
        for name in preservation domain material_distance; do\n /usr/bin/python3 \"\
        scripts/tests/test_original_review_r46_${name}.py\" >\"/tmp/r46-response/r46_${name}_test.txt\"\
        \ 2>&1\n printf '%s\\n' \"$?\" >\"/tmp/r46-response/r46_${name}_test_exit.txt\"\
        \n cat \"/tmp/r46-response/r46_${name}_test.txt\"\ndone\nfor name in motion\
        \ back_surface; do\n /usr/bin/python3 \"scripts/tests/test_original_review_r43_${name}.py\"\
        \ >\"/tmp/r46-response/r43_${name}_test.txt\" 2>&1\n printf '%s\\n' \"$?\"\
        \ >\"/tmp/r46-response/r43_${name}_test_exit.txt\"\n cat \"/tmp/r46-response/r43_${name}_test.txt\"\
        \ndone\nexit 0\n"
    - name: Measure all83 actual native responses before saving
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads
        2 --python-exit-code 1 --python scripts/detect_original_review_r46_contacts_blender.py
        -- /tmp/r46-response/source.npz /tmp/r46-response/solved.npz /tmp/r46-response/native_final.json
    - name: Run all13 original movement benchmarks before saving
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads
        2 --python-exit-code 1 --python scripts/validate_original_review_r46_benchmarks_blender.py
        -- /tmp/r46-response/source.npz /tmp/r46-response/solved.npz /tmp/r46-response/benchmarks_before_save.json
    - name: Save model only after all pre-save gates
      run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --threads
        2 --python-exit-code 1 --python scripts/build_original_review_candidate_r46_blender.py
      continue-on-error: true
    - name: Recheck saved identity and original82-pose guards
      shell: bash
      run: "set +e\nif [ -f ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018/HGPT_ORIGINAL_V1_REVIEW_R46_CODEX.blend\
        \ ]; then\n /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup\
        \ --threads 2 --python-exit-code 1 --python scripts/measure_original_review_r34_blender.py\
        \ -- identity ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018/HGPT_ORIGINAL_V1_REVIEW_R46_CODEX.blend\
        \ ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018/identity.json\n\
        \ printf '%s\\n' \"$?\" > /tmp/r46-response/identity_test_exit.txt\n /tmp/blender-5.2.1-linux-x64/blender\
        \ --background --factory-startup --threads 2 --python-exit-code 1 --python\
        \ scripts/measure_original_review_r34_blender.py -- guard ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018/HGPT_ORIGINAL_V1_REVIEW_R46_CODEX.blend\
        \ ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018/r46_guard_recheck.json\n\
        \ printf '%s\\n' \"$?\" > /tmp/r46-response/original_guard_test_exit.txt\n\
        fi\nexit 0\n"
    - name: Render actual saved model or clearly identified unsaved study
      shell: bash
      run: 'model=""

        if [ -f ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018/HGPT_ORIGINAL_V1_REVIEW_R46_CODEX.blend
        ]; then model=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46_20261018/HGPT_ORIGINAL_V1_REVIEW_R46_CODEX.blend;
        fi

        xvfb-run -a /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup
        --threads 2 --python-exit-code 1 --python scripts/render_original_review_r46_blender.py
        -- /tmp/r46-response/source.npz /tmp/r46-response/solved.npz /tmp/r46-study
        $model

        '
    - name: Run unchanged profile and contour acceptance tests
      shell: bash
      run: "set +e\nexport HGPT_CONTOUR_NPZ=/tmp/r46-study/R46/native_probe.npz\n\
        export HGPT_LINE_PARENT_NPZ=ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r38_20261017/probe/r35_contour_surfaces.npz\n\
        for name in r42_profile r37_contour r38_marks r41_line r41_front; do\n /usr/bin/python3\
        \ \"scripts/tests/test_original_review_${name}.py\" >\"/tmp/r46-response/${name}_test.txt\"\
        \ 2>&1\n printf '%s\\n' \"$?\" >\"/tmp/r46-response/${name}_test_exit.txt\"\
        \n cat \"/tmp/r46-response/${name}_test.txt\"\ndone\nexit 0\n"
    - name: Package native matching-angle images and two press videos
      run: /usr/bin/python3 scripts/package_original_review_r46.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: original-v1-r46-review
        path: '/tmp/r46-response/

          /tmp/r46-study/

          ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46*20261018/'
        retention-days: 14
    - name: Commit native evidence on the authorized branch without force
      run: 'git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add ORIGINAL_V1_WORK/anatomy/candidates/codex_review_r46*20261018/ docs/CODEX_ORIGINAL_V1_REVIEW_CANDIDATE_R46_20261018.md

        git commit -m ''R46 native full-motion review evidence; retain numerical failures
        and owner review pending''

        git push origin HEAD:claude/original-v1-consolidated-review-20261014

        '
    - name: Require all acceptance gates after preserving evidence
      run: '/usr/bin/python3 - <<''PYREQUIRE''

        from pathlib import Path

        import json

        paths=list(Path(''ORIGINAL_V1_WORK/anatomy/candidates'').glob(''codex_review_r46*20261018/r46_review.json''))

        assert len(paths)==1

        z=json.loads(paths[0].read_text());assert z[''status'']==''NUMERIC_CHECKS_PASSED_AWAITING_VISUAL_REVIEW'',z[''status'']

        PYREQUIRE

        '
concurrency:
  group: original-v1-r46-whole-motion
  cancel-in-progress: true
