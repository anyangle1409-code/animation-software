name: ChatGPT Handle Clearance Diagnostic Patch
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/chatgpt_handle_clearance.py
      - run: |
          git config user.name ChatGPT
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- src/retargeting/realCharacterDiagnostic.test.ts; then exit 0; fi
          git add src/retargeting/realCharacterDiagnostic.test.ts
          git commit -m 'test: report imported dumbbell handle skin clearance'
          git push
