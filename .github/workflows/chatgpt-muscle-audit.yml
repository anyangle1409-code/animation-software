name: ChatGPT Muscle Biomechanics Upgrade
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged biomechanics upgrade
        run: |
          sed -i 's/taper: 0.68/taper: 0.72/g' .github/chatgpt_muscle_upgrade.py
          python .github/chatgpt_muscle_upgrade.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/muscles/model.ts src/muscles/functions.test.ts docs/STUDIO_CAPABILITY_ROADMAP.md
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
            exit 0
          fi
          git commit -m "feat: add functional muscle paths and biomechanics checks"
          git push
