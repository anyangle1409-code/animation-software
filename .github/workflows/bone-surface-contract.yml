name: Bone-surface contract audit

on:
  push:
    branches:
      - codex/anatomical-bone-surfaces-foundation-20261009
  pull_request:
    paths:
      - 'scripts/anatomy_fit/bone_surface_contract.py'
      - 'scripts/test_bone_surface_contract.py'
      - '.github/workflows/bone-surface-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated no-Blender geometry contract tests
        run: python3 -m unittest discover -s scripts -p 'test_bone_surface_contract.py' -v
