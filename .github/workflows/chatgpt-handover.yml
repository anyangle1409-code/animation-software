name: ChatGPT studio handover
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update shared changelog
        run: python .github/chatgpt_handover.py
      - name: Commit handover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: log studio authoring and biomechanics upgrades"
          git push
