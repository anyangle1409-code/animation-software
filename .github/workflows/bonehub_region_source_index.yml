name: Visible Human male source bone region inventory

on:
  push:
    branches: [codex/bonehub-region-index-20261010]
    paths:
      - scripts/anatomy_fit/bonehub_region_source_index.py
      - scripts/test_bonehub_region_source_index.py
      - .github/workflows/bonehub_region_source_index.yml
      - docs/BONEHUB_REGION_SOURCE_INDEX_20261010.md
  pull_request:
    paths:
      - scripts/anatomy_fit/bonehub_region_source_index.py
      - scripts/test_bonehub_region_source_index.py
      - .github/workflows/bonehub_region_source_index.yml
      - docs/BONEHUB_REGION_SOURCE_INDEX_20261010.md

jobs:
  check-source-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: All existing intake and new discovery safety tests
        run: |
          python -m unittest discover -s scripts -p 'test_bonehub*intake.py' -v
          python -m unittest discover -s scripts -p 'test_bonehub_region_source_index.py' -v
      - name: Query source repo HEAD and enumerate candidate 3D bones at pinned revision
        run: |
          python scripts/anatomy_fit/bonehub_region_source_index.py \
            --network --output "$RUNNER_TEMP/bonehub-source-region-index.json"
          python - "$RUNNER_TEMP/bonehub-source-region-index.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          assert data["cp1_anatomical_acceptance"] is False
          assert data["canonical_geometry_modified"] is False
          assert data["source_subject_independent_of_existing_CT"] is False
          expected = {
              "carpus_file_candidate": 16,
              "tarsus_file_candidate": 14,
              "rib_file_candidate": 24,
          }
          for group, total in expected.items():
              assert data["counts_by_source_filename_category"][group] == total, (group, data["counts_by_source_filename_category"])
          from collections import Counter
          sides = Counter()
          for candidate in data["source_file_candidates"]:
              group = candidate["category"]
              rel = candidate["source_relpath"]
              if group in expected:
                  side = "LEFT" if (rel.startswith(("HAND_LEFT/", "FOOT_LEFT/")) or rel.endswith("_LEFT.stl")) else "RIGHT"
                  sides[(group, side)] += 1
          for group, per_side in (("carpus_file_candidate", 8), ("tarsus_file_candidate", 7), ("rib_file_candidate", 12)):
              assert sides[(group, "LEFT")] == per_side, (group, "LEFT", sides)
              assert sides[(group, "RIGHT")] == per_side, (group, "RIGHT", sides)
          print("Expected source-file candidate coverage confirmed on both labelled sides:", dict((str(k), v) for k,v in sides.items()))
          print(json.dumps({"source_revision": data["source_revision"],
                            "counts": data["counts_by_source_filename_category"],
                            "candidate_files": len(data["source_file_candidates"])}, indent=2))
          PY
      - name: Retain report without raw medical or mesh data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bonehub-male-source-candidate-inventory-no-mesh
          path: ${{ runner.temp }}/bonehub-source-region-index.json
          if-no-files-found: error
          retention-days: 7
