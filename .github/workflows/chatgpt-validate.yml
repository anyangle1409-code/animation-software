name: ChatGPT validate live contact workspace
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged live contact workspace
        run: python .github/chatgpt_contact_workspace.py
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Retain validated live contact workspace and clean temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constraints/contactDiagnostics.ts src/constraints/contactDiagnostics.test.ts src/editor/panels/ContactPanel.tsx src/editor/App.tsx src/editor/styles.css docs/STUDIO_CAPABILITY_ROADMAP.md AI_CHANGELOG.md
          git rm .github/chatgpt_contact_workspace.py .github/workflows/chatgpt-validate.yml
          git commit -m "feat: add live contact diagnostics workspace"
          git push
