name: Whole-body 206/427 Blender evidence intake guard
on:
  push:
    branches:
      - codex/whole-body-blender-evidence-gate-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full-anatomical-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify 206 bone 427 articulation 46 non-206 additions and blocker-aligned scene QA contract
        run: |
          python3 -m unittest discover -s scripts -p 'test_whole_body_blender_evidence_gate.py' -v
          python3 - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,"scripts/anatomy_fit")
          from whole_body_blender_evidence_gate import (
              source_context, audit_measurements, report_schema_template
          )
          home=Path("ORIGINAL_V1_WORK/anatomy")
          bones=json.loads((home/"adult_bone_inventory_206.json").read_text())
          joints=json.loads((home/"adult_articulation_inventory.json").read_text())
          readiness=json.loads((home/"canonical_freeze_readiness_v1.json").read_text())
          blockers=json.loads((home/"audit/claude_anatomical_development_20261009/blocker_matrix_v1.json").read_text())
          bs,js,regions=source_context(bones,joints,readiness,blockers)
          assert len(bs)==206 and len(js)==427
          assert len(joints["additional_structures"])==46
          assert readiness["region_counts"]=={"READY":0,"PARTIAL":9,"BLOCKED":3}
          assert len(blockers["blockers"])==11
          print("Source-pinned 206 conventional adult bones, 427 articulations, 46 ancillary structures, 12 region gates and 11 blockers verified; no Blender execution assumed.")
          PY
      - name: Enforce zero production mesh edits or fabricated blender outputs
        run: |
          test ! -e ORIGINAL_V1_WORK/anatomy/audit/whole_body_blender_measurement_accepted.json
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            Path("scripts/anatomy_fit/whole_body_blender_evidence_gate.py"),
            Path("scripts/test_whole_body_blender_evidence_gate.py"),
          ]
          for p in paths:compile(p.read_text(),str(p),"exec")
          print("No production skeleton, mesh, CT files or accepted anatomical reports generated by this workflow.")
          PY
