name: G5a original 67-joint palette addressing bounds
on:
  push:
    branches: [codex/g5a-palette-boundary-vertex-probe-20261012]
  pull_request:
    paths:
      - src/viewer/firstPartyOriginalPaletteShaderLink.mjs
      - tests/firstPartyOriginalPaletteShaderLink.test.mjs
      - .github/workflows/first_party_original_palette_boundary.yml
permissions:
  contents: read
jobs:
  bone-palette-address-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node --test tests/firstPartyOriginalPaletteShaderLink.test.mjs
      - run: node --test tests/firstPartyOriginalPaletteFloatUpload.test.mjs
      - run: node --test tests/firstPartyOriginalWebGL2Capability.test.mjs
