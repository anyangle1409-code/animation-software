name: ORIGINAL_v1 skeleton-in-skin containment (A1)
on:
  push:
    branches: [claude/master-execution-20261013]
  pull_request:
permissions:
  contents: read
jobs:
  native-skeleton-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: echo '670a37bfd206d702928de721032e2b942725389dc6906df0d866eba8d8cbbe56  ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend' | sha256sum -c -
      - name: Install pinned Blender 5.2.1
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz --output /tmp/blender-5.2.1-linux-x64.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender-5.2.1-linux-x64.tar.xz' | sha256sum -c -
          tar -xJf /tmp/blender-5.2.1-linux-x64.tar.xz -C /tmp
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend --python-exit-code 1 --python scripts/blender_tests/test_original_skeleton_containment.py
      - run: /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup ORIGINAL_V1_WORK/anatomy/audit/HGPT_ANATOMICAL_AUDIT_r95_a003.blend --python-exit-code 1 --python scripts/audit_original_skeleton_containment_blender.py -- --out /tmp/a1/skeleton_containment_report.json
      - run: diff <(python3 -c "import json; print(json.dumps(json.load(open('/tmp/a1/skeleton_containment_report.json'))['summary'], sort_keys=True))") <(python3 -c "import json; print(json.dumps(json.load(open('ORIGINAL_V1_WORK/anatomy/audit/claude_a1/skeleton_containment_report.json'))['summary'], sort_keys=True))")
        shell: bash
      - run: python3 -m unittest discover -s scripts -p 'test_whole_skeleton_validation_matrix.py' -v
