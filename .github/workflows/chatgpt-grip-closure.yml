name: ChatGPT Grip Closure Tuning
on:
  push:
    branches:
      - chatgpt/absolute-retarget-imports
permissions:
  contents: write
jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/chatgpt_grip_closure_patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name ChatGPT
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor/store.ts src/editor/store.test.ts src/editor/panels/ExercisePanel.tsx src/editor/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add live grip closure tuning'
          git push
